<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Історична інтерактивна карта – Закарпаття</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f3f0e7;
}


/* =========================================
   HEADER
========================================= */

header {
    background: #102638;
    color: white;
    padding: 20px 35px;
    border-bottom: 1px solid #c09d57;
}

header h1 {
    margin: 0;
    font-size: 27px;
    line-height: 1.3;
}

header p {
    margin: 6px 0 0;
    color: #c9ad6c;
    font-size: 14px;
}


/* =========================================
   LANGUAGE SWITCH
========================================= */

.language-switch {
    margin-top: 12px;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.language-switch a {
    color: white;
    text-decoration: none;
    margin-right: 12px;
}

.language-switch a:hover {
    color: #d8b86a;
}

.current-language {
    color: #d8b86a;
    font-weight: bold;
}


/* =========================================
   NAVIGATION
========================================= */

nav {
    background: #17374d;
    padding: 0 35px;
}

nav a {
    display: inline-block;
    padding: 15px;
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
}

nav a:hover {
    background: #c09d57;
    color: #102638;
}


/* =========================================
   MAP HEADER
========================================= */

.map-header {
    background: #f3f0e7;
    padding: 25px 35px;
}

.map-header h2 {
    margin: 0 0 8px;
    font-size: 30px;
    color: #17374d;
}

.map-header p {
    margin: 0;
    color: #5d666c;
    font-size: 15px;
}


/* =========================================
   MAP
========================================= */

#map {
    width: 100%;
    height: calc(100vh - 215px);
    min-height: 550px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    header {
        padding: 18px 15px;
    }

    header h1 {
        font-size: 21px;
    }

    nav {
        padding: 0 8px;
    }

    nav a {
        padding: 12px 8px;
        font-size: 11px;
    }

    .map-header {
        padding: 20px 15px;
    }

    .map-header h2 {
        font-size: 24px;
    }

    #map {
        height: calc(100vh - 200px);
        min-height: 450px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <h1>
        Географічний та історичний атлас Закарпаття
    </h1>

    <p>
        Географія • Історія • Колишні комітати
    </p>

    <div class="language-switch">

        <a href="tortenelmi-terkep.html">
            🇭🇺 MAGYAR
        </a>

        <span class="current-language">
            🇺🇦 УКРАЇНСЬКА
        </span>

    </div>

</header>


<!-- =========================================
     NAVIGATION
========================================= -->

<nav>

    <a href="index-ua.html">
        ГОЛОВНА
    </a>

    <a href="foldrajzi-terkep-ua.html">
        🌍 ГЕОГРАФІЧНА КАРТА
    </a>

    <a href="tortenelmi-terkep-ua.html">
        📜 ІСТОРИЧНА КАРТА
    </a>

</nav>


<!-- =========================================
     MAP HEADER
========================================= -->

<section class="map-header">

    <h2>
        📜 Інтерактивна історична карта
    </h2>

    <p>
        Історична карта Закарпаття,
        колишніх комітатів та історичних місць.
    </p>

</section>


<!-- =========================================
     MAP
========================================= -->

<div id="map"></div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================================
   ОСНОВНА КАРТА
========================================= */

const map = L.map('map').setView(
    [48.45, 22.75],
    8
);


/* =========================================
   БАЗОВА КАРТА
========================================= */

const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors'
    }
);

osm.addTo(map);


/* =========================================
   ІСТОРИЧНІ ШАРИ
========================================= */


/* Ужанський комітат */

const uzh =
    L.layerGroup();


/* Березький комітат */

const bereg =
    L.layerGroup();


/* Угочанський комітат */

const ugocsa =
    L.layerGroup();


/* Марамороський комітат */

const maramures =
    L.layerGroup();


/* Історичні населені пункти */

const historicalSettlements =
    L.layerGroup();


/* Замки та укріплення */

const castles =
    L.layerGroup();


/* Історичні події */

const historicalEvents =
    L.layerGroup();


/* Історичні дороги */

const historicalRoads =
    L.layerGroup();


/* Старі карти */

const oldMaps =
    L.layerGroup();


/* =========================================
   ШАРИ НА КАРТІ
========================================= */

const overlays = {

    "🏛️ Ужанський комітат":
        uzh,

    "🏛️ Березький комітат":
        bereg,

    "🏛️ Угочанський комітат":
        ugocsa,

    "🏛️ Марамороський комітат":
        maramures,

    "🏘️ Історичні населені пункти":
        historicalSettlements,

    "🏰 Замки та укріплення":
        castles,

    "⚔️ Історичні події":
        historicalEvents,

    "🛤️ Історичні дороги":
        historicalRoads,

    "🗺️ Старі карти":
        oldMaps

};


/* =========================================
   КОНТРОЛЬ ШАРІВ
========================================= */

L.control.layers(

    {
        "OpenStreetMap": osm
    },

    overlays,

    {
        collapsed: false
    }

).addTo(map);

</script>


</body>

</html>

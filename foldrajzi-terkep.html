     LEAFLET DRAW

    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js">
</script>


<script>

/* =====================================================
   ALAPKÉP
===================================================== */

const map = L.map('map').setView(
    [48.45, 22.75],
    8
);


/* =====================================================
   ALAPTÉRKÉPEK
===================================================== */

const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors'
    }
);


const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        maxZoom: 19,

        attribution:
            'Tiles &copy; Esri'
    }
);


const terrain = L.tileLayer(
    'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 17,

        attribution:
            'Map data &copy; OpenStreetMap contributors, SRTM | Map style &copy; OpenTopoMap'
    }
);


const darkMap = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors &copy; CARTO'
    }
);


const lightMap = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors &copy; CARTO'
    }
);


osm.addTo(map);


/* =====================================================
   FÖLDRAJZI RÉTEGEK
===================================================== */

const relief =
    L.layerGroup();

const mountains =
    L.layerGroup();

const rivers =
    L.layerGroup();

const lakes =
    L.layerGroup();

const settlements =
    L.layerGroup();

const roads =
    L.layerGroup();

const administrativeBoundaries =
    L.layerGroup();

const geological =
    L.layerGroup();

const climate =
    L.layerGroup();

const soils =
    L.layerGroup();

const vegetation =
    L.layerGroup();

const landscapes =
    L.layerGroup();

const natureProtection =
    L.layerGroup();

const naturalResources =
    L.layerGroup();

const naturalHazards =
    L.layerGroup();


/* =====================================================
   IMPORTÁLT GEOJSON
===================================================== */

const importedGeoJSON =
    L.layerGroup();


/* =====================================================
   CHATGPT GEOJSON
===================================================== */

const chatGPTGeoJSONLayer =
    L.layerGroup();

let chatGPTLayerNumber = 0;


/* =====================================================
   SAJÁT RAJZOK
===================================================== */

const drawnItems =
    new L.FeatureGroup();

map.addLayer(
    drawnItems
);


/* =====================================================
   RÉTEGEK
===================================================== */

const overlays = {

    "🏔️ Domborzat":
        relief,

    "⛰️ Hegységek":
        mountains,

    "🌊 Folyók":
        rivers,

    "💧 Tavak":
        lakes,

    "🏘️ Települések":
        settlements,

    "🛣️ Utak":
        roads,

    "🏛️ Közigazgatási határok":
        administrativeBoundaries,

    "🪨 Földtan":
        geological,

    "🌡️ Éghajlat":
        climate,

    "🌱 Talaj":
        soils,

    "🌲 Növényzet":
        vegetation,

    "🗺️ Tájak":
        landscapes,

    "🌿 Természetvédelem":
        natureProtection,

    "⛏️ Természeti erőforrások":
        naturalResources,

    "⚠️ Természeti veszélyek":
        naturalHazards,

    "📍 Importált GeoJSON":
        importedGeoJSON,

    "🤖 ChatGPT GeoJSON":
        chatGPTGeoJSONLayer,

    "✏️ Saját rajzok":
        drawnItems

};


/* =====================================================
   ALAPTÉRKÉPEK
===================================================== */

const baseLayers = {

    "OpenStreetMap":
        osm,

    "🛰️ Műhold":
        satellite,

    "⛰️ Topográfiai":
        terrain,

    "🌑 Sötét térkép":
        darkMap,

    "☀️ Világos térkép":
        lightMap

};


/* =====================================================
   RÉTEGVÁLASZTÓ
   JOBB FELSŐ SAROK
===================================================== */

const layerControl =
    L.control.layers(

        baseLayers,

        overlays,

        {
            collapsed: false,
            position: 'topright'
        }

    ).addTo(map);


/* =====================================================
   KOORDINÁTÁK
===================================================== */

const coordinatesControl =
    L.control({

        position:
            'bottomleft'

    });


coordinatesControl.onAdd =
function() {

    this._div =
        L.DomUtil.create(
            'div',
            'coordinates-info'
        );

    this.update();

    return this._div;
};


coordinatesControl.update =
function(latlng) {

    if (latlng) {

        this._div.innerHTML =

            '<strong>Szélesség:</strong> ' +

            latlng.lat.toFixed(6) +

            ' &nbsp;&nbsp; ' +

            '<strong>Hosszúság:</strong> ' +

            latlng.lng.toFixed(6);

    }

    else {

        this._div.innerHTML =
            'Mozgassa az egeret a térképen';

    }

};


coordinatesControl.addTo(
    map
);


map.on(
    'mousemove',
    function(e) {

        coordinatesControl.update(
            e.latlng
        );

    }
);


/* =====================================================
   SKÁLA
===================================================== */

L.control.scale({

    position:
        'bottomleft',

    metric:
        true,

    imperial:
        false,

    maxWidth:
        200

}).addTo(map);


/* =====================================================
   DRAW MENÜ
===================================================== */

const drawControl =
    new L.Control.Draw({

        position:
            'topleft',

        edit: {

            featureGroup:
                drawnItems,

            poly: {

                allowIntersection:
                    false

            }

        },

        draw: {

            polygon: {

                allowIntersection:
                    false,

                showArea:
                    true,

                shapeOptions: {

                    color:
                        '#b22222',

                    weight:
                        3,

                    fillOpacity:
                        0.25

                }

            },

            polyline: {

                shapeOptions: {

                    color:
                        '#17374d',

                    weight:
                        4

                }

            },

            rectangle: {

                shapeOptions: {

                    color:
                        '#8b6914',

                    weight:
                        3,

                    fillOpacity:
                        0.2

                }

            },

            marker:
                true,

            circle:
                false,

            circlemarker:
                false

        }

    });


map.addControl(
    drawControl
);


/* =====================================================
   KEREKÍTÉS
===================================================== */

function roundNumber(
    num,
    decimals
) {

    return Math.round(

        num *
        Math.pow(
            10,
            decimals
        )

    )
    /
    Math.pow(
        10,
        decimals
    );

}


/* =====================================================
   DRAW POPUP
===================================================== */

function getPopupContent(
    layer
) {

    if (
        layer instanceof L.Marker ||
        layer instanceof L.CircleMarker
    ) {

        return (

            '<strong>Koordináták</strong><br>' +

            'Szélesség: ' +

            roundNumber(
                layer.getLatLng().lat,
                6
            ) +

            '<br>' +

            'Hosszúság: ' +

            roundNumber(
                layer.getLatLng().lng,
                6
            )

        );

    }


    if (
        layer instanceof L.Polygon
    ) {

        return 'Poligon<br>' +
               'Geometria létrehozva.';

    }


    if (
        layer instanceof L.Polyline
    ) {

        const latlngs =
            layer.getLatLngs();

        let distance =
            0;


        if (
            latlngs.length > 1
        ) {

            for (
                let i = 0;
                i < latlngs.length - 1;
                i++
            ) {

                distance +=

                    latlngs[i]
                    .distanceTo(
                        latlngs[i + 1]
                    );

            }

        }


        if (
            distance > 1000
        ) {

            return (

                'Vonal<br>' +

                'Hosszúság: ' +

                roundNumber(
                    distance / 1000,
                    2
                ) +

                ' km'

            );

        }


        return (

            'Vonal<br>' +

            'Hosszúság: ' +

            roundNumber(
                distance,
                2
            ) +

            ' m'

        );

    }


    return null;

}


/* =====================================================
   DRAW LÉTREHOZÁS
===================================================== */

map.on(
    L.Draw.Event.CREATED,
    function(event) {

        const layer =
            event.layer;


        const content =
            getPopupContent(
                layer
            );


        if (
            content !== null
        ) {

            layer.bindPopup(
                content
            );

        }


        layer.feature =
            layer.feature ||
            {

                type:
                    'Feature',

                properties:
                    {}

            };


        layer.feature.properties =
            layer.feature.properties ||
            {};


        layer.feature.properties.info =
            content;


        drawnItems.addLayer(
            layer
        );

    }
);


/* =====================================================
   DRAW SZERKESZTÉS
===================================================== */

map.on(
    L.Draw.Event.EDITED,
    function(event) {

        event.layers.eachLayer(
            function(layer) {

                const content =
                    getPopupContent(
                        layer
                    );


                if (
                    content !== null
                ) {

                    layer.setPopupContent(
                        content
                    );

                }


                layer.feature =
                    layer.feature ||
                    {

                        type:
                            'Feature',

                        properties:
                            {}

                    };


                layer.feature.properties =
                    layer.feature.properties ||
                    {};


                layer.feature.properties.info =
                    content;

            }
        );

    }
);


/* =====================================================
   DRAW TÖRLÉS
===================================================== */

map.on(
    L.Draw.Event.DELETED,
    function() {

        console.log(
            'A kijelölt objektumok törölve.'
        );

    }
);


/* =====================================================
   GEOJSON IMPORT
===================================================== */

const fileInput =
    document.getElementById(
        'geojsonFileInput'
    );


function createGeoJSONLayer(
    data
) {

    return L.geoJSON(
        data,
        {

            style:
            function(feature) {

                return {

                    color:
                        '#8b2020',

                    weight:
                        3,

                    fillColor:
                        '#c09d57',

                    fillOpacity:
                        0.30

                };

            },


            pointToLayer:
            function(
                feature,
                latlng
            ) {

                return L.circleMarker(
                    latlng,
                    {

                        radius:
                            7,

                        color:
                            '#8b2020',

                        weight:
                            2,

                        fillColor:
                            '#c09d57',

                        fillOpacity:
                            0.85

                    }
                );

            },


            onEachFeature:
            function(
                feature,
                layer
            ) {

                if (
                    feature.properties
                ) {

                    let html =
                        '<strong>GeoJSON objektum</strong>';


                    Object.keys(
                        feature.properties
                    ).forEach(
                        function(key) {

                            html +=

                                '<br><strong>' +

                                key +

                                ':</strong> ' +

                                feature.properties[key];

                        }
                    );


                    layer.bindPopup(
                        html
                    );

                }

            }

        }
    );

}


function importGeoJSON() {

    fileInput.value = '';

    fileInput.click();

}


fileInput.addEventListener(
    'change',
    function(event) {

        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
        function(e) {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );


                importedGeoJSON.clearLayers();


                const layer =
                    createGeoJSONLayer(
                        data
                    );


                importedGeoJSON.addLayer(
                    layer
                );


                map.addLayer(
                    importedGeoJSON
                );


                const bounds =
                    layer.getBounds();


                if (
                    bounds.isValid()
                ) {

                    map.fitBounds(
                        bounds,
                        {
                            padding:
                                [30, 30]
                        }
                    );

                }


                alert(
                    'A GeoJSON fájl sikeresen betöltve.'
                );

            }

            catch(error) {

                console.error(
                    error
                );


                alert(
                    'Hiba a GeoJSON fájl beolvasásakor.'
                );

            }

        };


        reader.readAsText(
            file
        );

    }
);


/* =====================================================
   CHATGPT GEOJSON TISZTÍTÁSA
===================================================== */

function cleanChatGPTGeoJSON(
    text
) {

    let cleaned =
        text.trim();


    /* Markdown ```json ... ``` eltávolítása */

    if (
        cleaned.startsWith('```')
    ) {

        cleaned =
            cleaned.replace(
                /^```(?:json|geojson)?\s*/i,
                ''
            );


        cleaned =
            cleaned.replace(
                /\s*```$/,
                ''
            );

    }


    return cleaned.trim();

}


/* =====================================================
   CHATGPT GEOJSON BETÖLTÉSE
===================================================== */

function loadChatGPTGeoJSON() {

    const textarea =
        document.getElementById(
            'chatGPTGeoJSON'
        );


    const status =
        document.getElementById(
            'chatGPTStatus'
        );


    const text =
        cleanChatGPTGeoJSON(
            textarea.value
        );


    if (!text) {

        status.innerHTML =
            '⚠️ Nincs beillesztett GeoJSON.';

        status.style.color =
            '#a33';

        return;

    }


    let data;


    try {

        data =
            JSON.parse(
                text
            );

    }

    catch(error) {

        status.innerHTML =
            '❌ Hibás JSON / GeoJSON formátum.';

        status.style.color =
            '#a33';

        console.error(
            error
        );

        return;

    }


    if (
        !data.type
    ) {

        status.innerHTML =
            '❌ Hiányzik a GeoJSON type mező.';

        status.style.color =
            '#a33';

        return;

    }


    /* Régi ChatGPT réteg törlése */

    chatGPTGeoJSONLayer.clearLayers();


    /* Új GeoJSON */

    const layer =
        createGeoJSONLayer(
            data
        );


    chatGPTGeoJSONLayer.addLayer(
        layer
    );


    map.addLayer(
        chatGPTGeoJSONLayer
    );


    /* Új réteg neve */

    chatGPTLayerNumber++;


    const layerName =
        '🤖 ChatGPT GeoJSON ' +
        chatGPTLayerNumber;


    layerControl.addOverlay(
        chatGPTGeoJSONLayer,
        layerName
    );


    /* Automatikus zoom */

    try {

        const bounds =
            layer.getBounds();


        if (
            bounds.isValid()
        ) {

            map.fitBounds(
                bounds,
                {
                    padding:
                        [40, 40]
                }
            );

        }

    }

    catch(error) {

        console.log(
            'A GeoJSON kiterjedése nem határozható meg.'
        );

    }


    status.innerHTML =
        '✅ GeoJSON sikeresen betöltve a térképre.';

    status.style.color =
        '#176b3a';

}

/* =====================================================
   ÖSSZES GEOJSON EXPORT
===================================================== */

function geojsonExport() {

    const drawn =
        drawnItems.toGeoJSON();


    const imported =
        importedGeoJSON.toGeoJSON();


    const chatGPT =
        chatGPTGeoJSONLayer.toGeoJSON();


    const allFeatures = [];


    if (
        drawn &&
        drawn.features
    ) {

        drawn.features.forEach(
            function(feature) {

                allFeatures.push(
                    feature
                );

            }
        );

    }


    if (
        imported &&
        imported.features
    ) {

        imported.features.forEach(
            function(feature) {

                allFeatures.push(
                    feature
                );

            }
        );

    }


    if (
        chatGPT &&
        chatGPT.features
    ) {

        chatGPT.features.forEach(
            function(feature) {

                allFeatures.push(
                    feature
                );

            }
        );

    }


    const finalGeoJSON = {

        type:
            'FeatureCollection',

        features:
            allFeatures

    };


    if (
        finalGeoJSON.features.length === 0
    ) {

        alert(
            'Nincs exportálható objektum a térképen.'
        );

        return;

    }


    const json =
        JSON.stringify(
            finalGeoJSON,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    'application/geo+json'
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            'a'
        );


    const date =
        new Date();


    const dateString =

        date.getFullYear() +
        '-' +

        String(
            date.getMonth() + 1
        ).padStart(
            2,
            '0'
        ) +

        '-' +

        String(
            date.getDate()
        ).padStart(
            2,
            '0'
        );


    link.href =
        url;


    link.download =
        'karpatalja-atlasz-' +
        dateString +
        '.geojson';


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}

<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Földrajzi interaktív térkép – Kárpátalja</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/0.4.2/leaflet.draw.css">

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css">


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f0e7;
}

#map {
    width: 100%;
    height: 100vh;
}


/* ==========================================
   FELSŐ CÍM
========================================== */

.map-title {

    position: absolute;

    top: 15px;
    left: 60px;

    z-index: 1000;

    background: rgba(16,38,56,.94);

    color: white;

    padding: 12px 20px;

    border-left: 3px solid #c09d57;

    box-shadow:
        0 3px 12px rgba(0,0,0,.25);

    border-radius: 3px;

}

.map-title strong {

    display: block;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 19px;

}

.map-title span {

    display: block;

    margin-top: 3px;

    color: #d2b56c;

    font-size: 12px;

}


/* ==========================================
   KOORDINÁTÁK
========================================== */

.coordinates-info {

    padding: 7px 10px;

    font:
        13px/18px
        Arial,
        Helvetica,
        sans-serif;

    background: white;

    background:
        rgba(255,255,255,.92);

    box-shadow:
        0 0 10px
        rgba(0,0,0,.2);

    border-radius: 4px;

}


/* ==========================================
   RÉTEGKEZELŐ
========================================== */

.leaflet-control-layers {

    font-size: 13px;

}


/* ==========================================
   GEOJSON EXPORT
========================================== */

.export-control {

    background: white;

    padding: 8px 11px;

    border-radius: 4px;

    box-shadow:
        0 0 8px
        rgba(0,0,0,.25);

    cursor: pointer;

    font-size: 13px;

}

.export-control:hover {

    background: #eeeeee;

}


/* ==========================================
   MOBIL
========================================== */

@media (max-width: 700px) {

    .map-title {

        left: 55px;

        top: 10px;

        padding: 9px 12px;

    }

    .map-title strong {

        font-size: 15px;

    }

    .map-title span {

        font-size: 10px;

    }

}

</style>

</head>


<body>


<!-- ==========================================
     TÉRKÉP CÍME
========================================== -->

<div class="map-title">

    <strong>
        Kárpátalja
    </strong>

    <span>
        🌍 Interaktív földrajzi térkép
    </span>

</div>


<!-- ==========================================
     TÉRKÉP
========================================== -->

<div id="map"></div>


<!-- ==========================================
     KÖNYVTÁRAK
========================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js">
</script>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/0.4.2/leaflet.draw.js">
</script>

<script
    src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js">
</script>


<!-- ==========================================
     ZIP ADATOK
========================================== -->

<script src="./data/line.js"></script>

<script src="./data/point.js"></script>

<script src="./data/polygon.js"></script>

<script src="./data/nepaldata.js"></script>


<script>


/* ==================================================
   TÉRKÉP
================================================== */

var map =
    L.map('map').setView(
        [48.20579018144784,
         22.644663061560948],
        8
    );


/* ==================================================
   ALAPTÉRKÉPEK
================================================== */


/* OpenStreetMap */

var osm =
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {

            maxZoom: 19,

            attribution:
                '&copy; OpenStreetMap contributors'

        }
    );


/* Google Térkép */

var googleStreets =
    L.tileLayer(
        'https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
        {

            maxZoom: 20,

            subdomains:
                ['mt0','mt1','mt2','mt3']

        }
    );


/* Műhold */

var googleSat =
    L.tileLayer(
        'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
        {

            maxZoom: 20,

            subdomains:
                ['mt0','mt1','mt2','mt3']

        }
    );


/* Google Terrain */

var googleTerrain =
    L.tileLayer(
        'https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}',
        {

            maxZoom: 20,

            subdomains:
                ['mt0','mt1','mt2','mt3']

        }
    );


/* Google Hybrid */

var googleHybrid =
    L.tileLayer(
        'https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',
        {

            maxZoom: 20,

            subdomains:
                ['mt0','mt1','mt2','mt3']

        }
    );


/* CyclOSM */

var CyclOSM =
    L.tileLayer(
        'https://tile.thunderforest.com/cycle/{z}/{x}/{y}.png?apikey=ba624ccccf5448f4946ad3de45173189',
        {

            maxZoom: 20,

            attribution:
                'CyclOSM | OpenStreetMap contributors'

        }
    );


/* OpenTopoMap */

var OpenTopoMap =
    L.tileLayer(
        'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
        {

            maxZoom: 17,

            attribution:
                'OpenTopoMap | OpenStreetMap contributors'

        }
    );


/* Dark Matter */

var CartoDB_DarkMatter =
    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {

            maxZoom: 19,

            subdomains:
                ['a','b','c','d'],

            attribution:
                'OpenStreetMap contributors & CARTO'

        }
    );


/* Water Color */

var Stamen_Watercolor =
    L.tileLayer(
        'https://stamen-tiles-{s}.a.ssl.fastly.net/watercolor/{z}/{x}/{y}.{ext}',
        {

            subdomains:
                'abcd',

            minZoom: 1,

            maxZoom: 16,

            ext: 'jpg',

            attribution:
                'Stamen Design | OpenStreetMap'

        }
    );


/* Alapértelmezett */

osm.addTo(map);


/* ==================================================
   KOORDINÁTÁK
================================================== */

var coordinatesControl =
    L.control({
        position:
            'bottomright'
    });


coordinatesControl.onAdd =
function(map) {

    this._div =
        L.DomUtil.create(
            'div',
            'coordinates-info'
        );

    this.update();

    return this._div;

};


coordinatesControl.update =
function(latlng) {

    if (latlng) {

        this._div.innerHTML =

            '<strong>Szélesség:</strong> ' +
            latlng.lat.toFixed(6) +

            ' &nbsp; ' +

            '<strong>Hosszúság:</strong> ' +
            latlng.lng.toFixed(6);

    }

    else {

        this._div.innerHTML =
            'Mutasson a térképre!';

    }

};


coordinatesControl.addTo(map);


map.on(
    'mousemove',
    function(e) {

        coordinatesControl.update(
            e.latlng
        );

    }
);


/* ==================================================
   MÉRÉSI SKÁLA
================================================== */

L.control.scale({

    position:
        'bottomleft',

    metric:
        true,

    imperial:
        false,

    maxWidth:
        200

}).addTo(map);


/* ==================================================
   FÖLDRAJZI RÉTEGEK
================================================== */


/* Domborzat */

var domborzat =
    L.layerGroup();


/* Földtan */

var foldtan =
    L.layerGroup();


/* Vízrajz */

var vizrajz =
    L.layerGroup();


/* Éghajlat */

var eghajlat =
    L.layerGroup();


/* Talaj */

var talaj =
    L.layerGroup();


/* Növényzet */

var novenyzet =
    L.layerGroup();


/* Állatvilág */

var allatvilag =
    L.layerGroup();


/* Tájak */

var tajak =
    L.layerGroup();


/* Természetvédelem */

var termeszetvedelem =
    L.layerGroup();


/* Természeti erőforrások */

var termeszetiEroforrasok =
    L.layerGroup();


/* Természeti veszélyek */

var termeszetiVeszelyek =
    L.layerGroup();


/* ==================================================
   ZIP GEOJSON ADATOK
================================================== */

var linedata =
    L.geoJSON(
        lineJSON
    );


var pointdata =
    L.geoJSON(
        pointJSON
    );


var polygondata =
    L.geoJSON(
        polygonJSON,
        {

            onEachFeature:
            function(
                feature,
                layer
            ) {

                if (
                    feature.properties &&
                    feature.properties.name
                ) {

                    layer.bindPopup(
                        '<b>' +
                        feature.properties.name +
                        '</b>'
                    );

                }

            },

            style: {

                fillColor:
                    'red',

                fillOpacity:
                    1,

                color:
                    'green'

            }

        }
    );


var nepalData =
    L.geoJSON(
        nepaldataa
    );


/* ==================================================
   ZIP RÉTEGEKET A FÖLDRAJZI RENDSZERHEZ
================================================== */

linedata.addTo(
    domborzat
);

polygondata.addTo(
    tajak
);

pointdata.addTo(
    telepulesek = L.layerGroup()
);


/* ==================================================
   TELEPÜLÉSEK
================================================== */

var telepulesek =
    L.layerGroup();


pointdata.addTo(
    telepulesek
);


/* ==================================================
   KÖZIGAZGATÁS
================================================== */

var kozigazgatas =
    L.layerGroup();


/* ==================================================
   RÉTEGKEZELŐ
================================================== */

var baseLayers = {

    "🗺️ OpenStreetMap":
        osm,

    "🗺️ Google Térkép":
        googleStreets,

    "🛰️ Műhold":
        googleSat,

    "⛰️ Google Terep":
        googleTerrain,

    "🛰️ Google Hybrid":
        googleHybrid,

    "🎨 Water Color":
        Stamen_Watercolor,

    "🚲 CyclOSM":
        CyclOSM,

    "🏔️ OpenTopoMap":
        OpenTopoMap,

    "🌑 Dark Matter":
        CartoDB_DarkMatter

};


var overlays = {

    "🌄 Domborzat":
        domborzat,

    "🪨 Földtan":
        foldtan,

    "🌊 Vízrajz":
        vizrajz,

    "🌤️ Éghajlat":
        eghajlat,

    "🌱 Talaj":
        talaj,

    "🌲 Növényzet":
        novenyzet,

    "🦌 Állatvilág":
        allatvilag,

    "🏔️ Tájak":
        tajak,

    "🌿 Természetvédelem":
        termeszetvedelem,

    "⛏️ Természeti erőforrások":
        termeszetiEroforrasok,

    "⚠️ Természeti veszélyek":
        termeszetiVeszelyek,

    "🏘️ Települések":
        telepulesek,

    "🏛️ Közigazgatás":
        kozigazgatas,

    "〰️ Vonaladatok":
        linedata,

    "📍 Pontadatok":
        pointdata,

    "⬟ Poligonadatok":
        polygondata,

    "🗺️ Térképi adatok":
        nepalData

};


L.control.layers(

    baseLayers,

    overlays,

    {

        collapsed:
            false

    }

).addTo(map);


/* ==================================================
   LEAFLET DRAW
================================================== */

var drawnItems =
    new L.FeatureGroup();


map.addLayer(
    drawnItems
);


var drawControl =
    new L.Control.Draw({

        edit: {

            featureGroup:
                drawnItems

        },

        draw: {

            circle:
                false,

            circlemarker:
                false,

            polygon: {

                allowIntersection:
                    false,

                showArea:
                    true

            }

        }

    });


map.addControl(
    drawControl
);


/* ==================================================
   MÉRÉS
================================================== */

var _round =
function(num, len) {

    return Math.round(
        num *
        Math.pow(
            10,
            len
        )
    )
    /
    Math.pow(
        10,
        len
    );

};


var strLatLng =
function(latlng) {

    return '(' +
        _round(
            latlng.lat,
            6
        ) +
        ', ' +
        _round(
            latlng.lng,
            6
        ) +
        ')';

};


var getPopupContent =
function(layer) {

    if (
        layer instanceof L.Marker ||
        layer instanceof L.CircleMarker
    ) {

        return strLatLng(
            layer.getLatLng()
        );

    }


    else if (
        layer instanceof L.Circle
    ) {

        var center =
            layer.getLatLng();

        var radius =
            layer.getRadius();

        return
            'Középpont: ' +
            strLatLng(center) +
            '<br>' +

            'Sugár: ' +
            _round(
                radius,
                2
            ) +
            ' m';

    }


    else if (
        layer instanceof L.Polygon
    ) {

        return 'Terület: poligon';

    }


    else if (
        layer instanceof L.Polyline
    ) {

        var latlngs =
            layer.getLatLngs();

        var distance =
            0;


        if (
            latlngs.length < 2
        ) {

            return
                'Távolság: N/A';

        }


        for (
            var i = 0;
            i < latlngs.length - 1;
            i++
        ) {

            distance +=
                latlngs[i]
                .distanceTo(
                    latlngs[i + 1]
                );

        }


        if (
            distance > 1000
        ) {

            return
                'Távolság: ' +
                _round(
                    distance / 1000,
                    2
                ) +
                ' km';

        }


        return
            'Távolság: ' +
            _round(
                distance,
                2
            ) +
            ' m';

    }


    return null;

};


/* ==================================================
   RAJZOLÁS
================================================== */

map.on(
    L.Draw.Event.CREATED,
    function(event) {

        var layer =
            event.layer;

        var content =
            getPopupContent(
                layer
            );


        if (
            content !== null
        ) {

            layer.bindPopup(
                content
            );

        }


        layer.feature =
            layer.feature || {};

        layer.feature.type =
            'Feature';

        layer.feature.properties =
            layer.feature.properties || {};

        layer.feature.properties.info =
            content;


        drawnItems.addLayer(
            layer
        );

    }
);


/* ==================================================
   SZERKESZTÉS
================================================== */

map.on(
    L.Draw.Event.EDITED,
    function(event) {

        event.layers.eachLayer(
            function(layer) {

                var content =
                    getPopupContent(
                        layer
                    );


                if (
                    content !== null
                ) {

                    layer.setPopupContent(
                        content
                    );

                }

            }
        );

    }
);


/* ==================================================
   GEOJSON EXPORT
================================================== */

var exportControl =
    L.control({

        position:
            'bottomright'

    });


exportControl.onAdd =
function(map) {

    var div =
        L.DomUtil.create(
            'div',
            'export-control'
        );


    div.innerHTML =
        '⬇️ GeoJSON export';


    L.DomEvent.on(
        div,
        'click',
        function() {

            geojsonExport();

        }
    );


    return div;

};


exportControl.addTo(
    map
);


function geojsonExport() {

    var jsonData =
        JSON.stringify(
            drawnItems.toGeoJSON()
        );


    if (
        drawnItems.getLayers()
        .length === 0
    ) {

        alert(
            'Nincs exportálható rajz a térképen.'
        );

        return;

    }


    var dataUri =
        'data:application/json;charset=utf-8,' +
        encodeURIComponent(
            jsonData
        );


    var link =
        document.createElement(
            'a'
        );


    link.setAttribute(
        'href',
        dataUri
    );


    link.setAttribute(
        'download',
        'karpatalja-foldrajzi-adatok.geojson'
    );


    link.click();

}


/* ==================================================
   KERESÉS
================================================== */

L.Control.geocoder({

    defaultMarkGeocode:
        true

}).addTo(map);


/* ==================================================
   TÉRKÉP FRISSÍTÉSE
================================================== */

setTimeout(
    function() {

        map.invalidateSize();

    },
    500
);

</script>

</body>

</html>

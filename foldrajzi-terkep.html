<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Interaktív földrajzi térkép – Kárpátalja</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
/>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f3f0e7;
}


/* =========================================
   FEJLÉC
========================================= */

header {
    background: #102638;
    color: white;
    padding: 12px 35px;
    border-bottom: 1px solid #c09d57;
}

header h1 {
    margin: 0;
    font-size: 27px;
    line-height: 1.3;
}

header p {
    margin: 5px 0 0;
    color: #c9ad6c;
    font-size: 14px;
}


/* =========================================
   NYELVVÁLTÓ
========================================= */

.language-switch {
    margin-top: 10px;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.language-switch a {
    color: white;
    text-decoration: none;
    margin-right: 12px;
}

.language-switch a:hover {
    color: #d8b86a;
}

.current-language {
    color: #d8b86a;
    font-weight: bold;
}


/* =========================================
   NAVIGÁCIÓ
========================================= */

nav {
    background: #17374d;
    padding: 0 35px;
    height: 34px;
}

nav a {
    display: inline-block;
    padding: 9px 15px;
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
}

nav a:hover {
    background: #c09d57;
    color: #102638;
}


/* =========================================
   TÉRKÉP FEJLÉC
========================================= */

.map-header {
    background: #f3f0e7;
    padding: 18px 25px;
}

.map-header h2 {
    margin: 0 0 5px;
    font-size: 28px;
    color: #17374d;
}

.map-header p {
    margin: 0;
    color: #5d666c;
    font-size: 14px;
}


/* =========================================
   TÉRKÉP
========================================= */

#map {
    width: 100%;
    height: calc(100vh - 176px);
    min-height: 550px;
}


/* =========================================
   GEOJSON IMPORT / EXPORT
========================================= */

.geojson-control {
    background: white;
    border-radius: 4px;
    box-shadow: 0 1px 5px rgba(0,0,0,.35);
    overflow: hidden;
}

.geojson-control button {
    display: block;
    width: 150px;
    padding: 8px 10px;
    border: none;
    border-bottom: 1px solid #ddd;
    background: white;
    color: #17374d;
    text-align: left;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
}

.geojson-control button:last-child {
    border-bottom: none;
}

.geojson-control button:hover {
    background: #f0eadb;
}

.geojson-control .import-button {
    color: #17374d;
}

.geojson-control .export-button {
    color: #8b2020;
}


/* =========================================
   KOORDINÁTÁK
========================================= */

.coordinates-info {
    background: rgba(255,255,255,.95);
    padding: 7px 14px;
    border-radius: 4px;
    box-shadow: 0 1px 5px rgba(0,0,0,.3);
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #17374d;
    white-space: nowrap;
}


/* =========================================
   INPUT
========================================= */

#geojsonFileInput {
    display: none;
}


/* =========================================
   RÉTEGEK
========================================= */

.leaflet-control-layers {
    font-family: Arial, sans-serif;
    font-size: 12px;
}

.leaflet-control-layers-expanded {
    padding: 8px 10px;
    background: rgba(255,255,255,.97);
}


/* =========================================
   DRAW
========================================= */

.leaflet-draw-toolbar a {
    background-color: white;
}


/* =========================================
   CHATGPT PANEL
========================================= */

.chatgpt-control {
    background: rgba(255,255,255,.98);
    width: 330px;
    padding: 10px;
    border-radius: 4px;
    box-shadow: 0 1px 6px rgba(0,0,0,.4);
    font-family: Arial, sans-serif;
}

.chatgpt-title {
    color: #17374d;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 6px;
}

.chatgpt-description {
    color: #666;
    font-size: 11px;
    line-height: 1.4;
    margin-bottom: 7px;
}

.chatgpt-textarea {
    width: 100%;
    height: 145px;
    resize: vertical;
    padding: 8px;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: #fafafa;
    font-family: Consolas, "Courier New", monospace;
    font-size: 11px;
    color: #222;
}

.chatgpt-textarea:focus {
    outline: none;
    border-color: #17374d;
}

.chatgpt-buttons {
    display: flex;
    gap: 6px;
    margin-top: 7px;
}

.chatgpt-button {
    border: none;
    border-radius: 4px;
    padding: 7px 9px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
}

.chatgpt-load {
    background: #17374d;
    color: white;
}

.chatgpt-load:hover {
    background: #24546e;
}

.chatgpt-clear {
    background: #ddd;
    color: #333;
}

.chatgpt-clear:hover {
    background: #ccc;
}

.chatgpt-status {
    margin-top: 7px;
    font-size: 11px;
    line-height: 1.4;
    color: #555;
}


/* =========================================
   GEOJSON.IO-SZERŰ SZERKESZTŐ
========================================= */

.geo-editor-control {
    width: 350px;
    max-width: calc(100vw - 30px);
    background: rgba(255,255,255,.98);
    border-radius: 5px;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.geo-editor-header {
    background: #17374d;
    color: #fff;
    padding: 9px 11px;
    font-size: 13px;
    font-weight: bold;
}

.geo-editor-body {
    padding: 9px;
}

.geo-editor-row {
    display: flex;
    gap: 6px;
    margin-bottom: 7px;
}

.geo-editor-row label {
    width: 75px;
    padding-top: 6px;
    font-size: 11px;
    font-weight: bold;
}

.geo-editor-row input,
.geo-editor-row textarea,
.geo-editor-code {
    flex: 1;
    min-width: 0;
    border: 1px solid #aaa;
    border-radius: 3px;
    padding: 6px;
    font-size: 11px;
}

.geo-editor-row textarea {
    min-height: 70px;
    resize: vertical;
}

.geo-editor-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 7px;
}

.geo-editor-button {
    border: 0;
    border-radius: 3px;
    padding: 7px 9px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
}

.geo-editor-primary {
    background: #17374d;
    color: white;
}

.geo-editor-success {
    background: #176b3a;
    color: white;
}

.geo-editor-danger {
    background: #8b2020;
    color: white;
}

.geo-editor-secondary {
    background: #ddd;
    color: #333;
}

.geo-editor-code {
    display: block;
    width: 100%;
    height: 180px;
    resize: vertical;
    font-family: Consolas, "Courier New", monospace;
}

.geo-editor-status {
    margin-top: 7px;
    padding: 6px;
    background: #f5f5f5;
    border-radius: 3px;
    font-size: 10px;
    color: #555;
}

@media (max-width: 700px) {

    .geo-editor-control {
        width: 290px;
    }

}


/* =========================================
   MOBIL
========================================= */

@media (max-width: 700px) {

    header {
        padding: 12px 15px;
    }

    header h1 {
        font-size: 20px;
    }

    nav {
        padding: 0 8px;
        overflow-x: auto;
        white-space: nowrap;
    }

    nav a {
        padding: 9px 7px;
        font-size: 10px;
    }

    .map-header {
        padding: 15px;
    }

    .map-header h2 {
        font-size: 22px;
    }

    #map {
        height: calc(100vh - 170px);
        min-height: 450px;
    }

    .geojson-control button {
        width: 135px;
        font-size: 11px;
    }

    .coordinates-info {
        font-size: 10px;
        padding: 6px 8px;
    }

    .chatgpt-control {
        width: 285px;
    }

    .chatgpt-textarea {
        height: 120px;
    }

}

</style>

</head>


<body>


<header>

    <h1>
        Kárpátalja Földrajzi és Történeti Atlasza
    </h1>

    <p>
        Földrajz • Történelem • Egykori vármegyék
    </p>

    <div class="language-switch">

        <span class="current-language">
            🇭🇺 MAGYAR
        </span>

        <a href="foldrajzi-terkep-uk.html">
            🇺🇦 УКРАЇНСЬКА
        </a>

    </div>

</header>


<nav>

    <a href="index.html">
        FŐOLDAL
    </a>

    <a href="foldrajzi-terkep.html">
        🌍 FÖLDRAJZI TÉRKÉP
    </a>

    <a href="tortenelmi-terkep.html">
        📜 TÖRTÉNELMI TÉRKÉP
    </a>

</nav>


<section class="map-header">

    <h2>
        🌍 Interaktív földrajzi térkép
    </h2>

    <p>
        Kárpátalja földrajzi térképe
        természetföldrajzi és földrajzi objektumokkal.
    </p>

</section>


<div id="map"></div>


<input
    type="file"
    id="geojsonFileInput"
    accept=".geojson,.json,application/geo+json,application/json"
/>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js">
</script>


<script>

/* =========================================
   ALAPTÉRKÉP
========================================= */

const map =
    L.map('map').setView(
        [48.45, 22.75],
        8
    );


/* =========================================
   ALAPTÉRKÉPEK
========================================= */

const osm =
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    );


const satellite =
    L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
            maxZoom: 19,
            attribution:
                'Tiles &copy; Esri'
        }
    );


const terrain =
    L.tileLayer(
        'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 17,
            attribution:
                'Map data &copy; OpenStreetMap contributors, SRTM | Map style &copy; OpenTopoMap'
        }
    );


const darkMap =
    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors &copy; CARTO'
        }
    );


const lightMap =
    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors &copy; CARTO'
        }
    );


osm.addTo(map);


/* =========================================
   FÖLDRAJZI RÉTEGEK
========================================= */

const relief =
    L.layerGroup();

const mountains =
    L.layerGroup();

const rivers =
    L.layerGroup();

const lakes =
    L.layerGroup();

const settlements =
    L.layerGroup();

const roads =
    L.layerGroup();

const administrativeBoundaries =
    L.layerGroup();

const geological =
    L.layerGroup();

const climate =
    L.layerGroup();

const soils =
    L.layerGroup();

const vegetation =
    L.layerGroup();

const landscapes =
    L.layerGroup();

const natureProtection =
    L.layerGroup();

const naturalResources =
    L.layerGroup();

const naturalHazards =
    L.layerGroup();


/* =========================================
   GEOJSON RÉTEGEK
========================================= */

const importedGeoJSON =
    L.layerGroup();

const chatGPTGeoJSONLayer =
    L.layerGroup();


/* =========================================
   SAJÁT RAJZOK
========================================= */

const drawnItems =
    new L.FeatureGroup();

map.addLayer(
    drawnItems
);


/* =========================================
   RÉTEGEK
========================================= */

const overlays = {

    "🏔️ Domborzat":
        relief,

    "⛰️ Hegységek":
        mountains,

    "🌊 Folyók":
        rivers,

    "💧 Tavak":
        lakes,

    "🏘️ Települések":
        settlements,

    "🛣️ Utak":
        roads,

    "🏛️ Közigazgatási határok":
        administrativeBoundaries,

    "🪨 Földtan":
        geological,

    "🌡️ Éghajlat":
        climate,

    "🌱 Talaj":
        soils,

    "🌲 Növényzet":
        vegetation,

    "🗺️ Tájak":
        landscapes,

    "🌿 Természetvédelem":
        natureProtection,

    "⛏️ Természeti erőforrások":
        naturalResources,

    "⚠️ Természeti veszélyek":
        naturalHazards,

    "📍 Importált GeoJSON":
        importedGeoJSON,

    "🤖 ChatGPT GeoJSON":
        chatGPTGeoJSONLayer,

    "✏️ Saját rajzok":
        drawnItems

};


/* =========================================
   ALAPTÉRKÉPEK
========================================= */

const baseLayers = {

    "OpenStreetMap":
        osm,

    "🛰️ Műhold":
        satellite,

    "⛰️ Topográfiai":
        terrain,

    "🌑 Sötét térkép":
        darkMap,

    "☀️ Világos térkép":
        lightMap

};


/* =========================================
   RÉTEGVÁLASZTÓ
========================================= */

const layerControl =
    L.control.layers(

        baseLayers,

        overlays,

        {
            collapsed: false,
            position: 'topright'
        }

    ).addTo(map);


/* =========================================
   KOORDINÁTÁK
========================================= */

const coordinatesControl =
    L.control({
        position:
            'bottomleft'
    });


coordinatesControl.onAdd =
function() {

    this._div =
        L.DomUtil.create(
            'div',
            'coordinates-info'
        );

    this.update();

    return this._div;
};


coordinatesControl.update =
function(latlng) {

    if (latlng) {

        this._div.innerHTML =

            '<strong>Szélesség:</strong> ' +

            latlng.lat.toFixed(6) +

            ' &nbsp;&nbsp; ' +

            '<strong>Hosszúság:</strong> ' +

            latlng.lng.toFixed(6);

    }

    else {

        this._div.innerHTML =
            'Mozgassa az egeret a térképen';

    }

};


coordinatesControl.addTo(map);


map.on(
    'mousemove',
    function(e) {

        coordinatesControl.update(
            e.latlng
        );

    }
);


/* =========================================
   SKÁLA
========================================= */

L.control.scale({

    position:
        'bottomleft',

    metric:
        true,

    imperial:
        false,

    maxWidth:
        200

}).addTo(map);


/* =========================================
   DRAW
========================================= */

const drawControl =
    new L.Control.Draw({

        position:
            'topleft',

        edit: {

            featureGroup:
                drawnItems,

            poly: {

                allowIntersection:
                    false

            }

        },

        draw: {

            polygon: {

                allowIntersection:
                    false,

                showArea:
                    true,

                shapeOptions: {

                    color:
                        '#b22222',

                    weight:
                        3,

                    fillOpacity:
                        0.25

                }

            },

            polyline: {

                shapeOptions: {

                    color:
                        '#17374d',

                    weight:
                        4

                }

            },

            rectangle: {

                shapeOptions: {

                    color:
                        '#8b6914',

                    weight:
                        3,

                    fillOpacity:
                        0.2

                }

            },

            marker:
                true,

            circle:
                false,

            circlemarker:
                false

        }

    });


map.addControl(
    drawControl
);


/* =========================================
   DRAW POPUP
========================================= */

function roundNumber(
    num,
    decimals
) {

    return Math.round(

        num *
        Math.pow(
            10,
            decimals
        )

    )
    /
    Math.pow(
        10,
        decimals
    );

}


function getPopupContent(
    layer
) {

    if (
        layer instanceof L.Marker ||
        layer instanceof L.CircleMarker
    ) {

        return (

            '<strong>Koordináták</strong><br>' +

            'Szélesség: ' +

            roundNumber(
                layer.getLatLng().lat,
                6
            ) +

            '<br>' +

            'Hosszúság: ' +

            roundNumber(
                layer.getLatLng().lng,
                6
            )

        );

    }


    if (
        layer instanceof L.Polygon
    ) {

        return 'Poligon<br>Geometria létrehozva.';

    }


    if (
        layer instanceof L.Polyline
    ) {

        const latlngs =
            layer.getLatLngs();

        let distance =
            0;


        if (
            latlngs.length > 1
        ) {

            for (
                let i = 0;
                i < latlngs.length - 1;
                i++
            ) {

                distance +=
                    latlngs[i].distanceTo(
                        latlngs[i + 1]
                    );

            }

        }


        if (
            distance > 1000
        ) {

            return (
                'Vonal<br>' +
                'Hosszúság: ' +
                roundNumber(
                    distance / 1000,
                    2
                ) +
                ' km'
            );

        }


        return (
            'Vonal<br>' +
            'Hosszúság: ' +
            roundNumber(
                distance,
                2
            ) +
            ' m'
        );

    }


    return null;

}


/* =========================================
   DRAW LÉTREHOZÁS
========================================= */

map.on(
    L.Draw.Event.CREATED,
    function(event) {

        const layer =
            event.layer;


        const content =
            getPopupContent(
                layer
            );


        if (
            content !== null
        ) {

            layer.bindPopup(
                content
            );

        }


        layer.feature =
            layer.feature ||
            {
                type:
                    'Feature',

                properties:
                    {}
            };


        layer.feature.properties =
            layer.feature.properties ||
            {};


        layer.feature.properties.info =
            content;


        drawnItems.addLayer(
            layer
        );

    }
);


/* =========================================
   DRAW SZERKESZTÉS
========================================= */

map.on(
    L.Draw.Event.EDITED,
    function(event) {

        event.layers.eachLayer(
            function(layer) {

                const content =
                    getPopupContent(
                        layer
                    );


                if (
                    content !== null
                ) {

                    layer.setPopupContent(
                        content
                    );

                }

            }
        );

    }
);


/* =========================================
   GEOJSON LÉTREHOZÁSA
========================================= */

function createGeoJSONLayer(
    data
) {

    return L.geoJSON(
        data,
        {

            style:
            function() {

                return {

                    color:
                        '#8b2020',

                    weight:
                        3,

                    fillColor:
                        '#c09d57',

                    fillOpacity:
                        0.30

                };

            },


            pointToLayer:
            function(
                feature,
                latlng
            ) {

                return L.circleMarker(
                    latlng,
                    {

                        radius:
                            7,

                        color:
                            '#8b2020',

                        weight:
                            2,

                        fillColor:
                            '#c09d57',

                        fillOpacity:
                            0.85

                    }
                );

            },


            onEachFeature:
            function(
                feature,
                layer
            ) {

                if (
                    feature.properties
                ) {

                    let html =
                        '<strong>GeoJSON objektum</strong>';


                    Object.keys(
                        feature.properties
                    ).forEach(
                        function(key) {

                            html +=
                                '<br><strong>' +
                                key +
                                ':</strong> ' +
                                feature.properties[key];

                        }
                    );


                    layer.bindPopup(
                        html
                    );

                }

            }

        }
    );

}


/* =========================================
   GEOJSON IMPORT
========================================= */

const fileInput =
    document.getElementById(
        'geojsonFileInput'
    );


function importGeoJSON() {

    fileInput.value = '';

    fileInput.click();

}


fileInput.addEventListener(
    'change',
    function(event) {

        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
        function(e) {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );


                importedGeoJSON.clearLayers();


                const layer =
                    createGeoJSONLayer(
                        data
                    );


                importedGeoJSON.addLayer(
                    layer
                );


                map.addLayer(
                    importedGeoJSON
                );


                const bounds =
                    layer.getBounds();


                if (
                    bounds.isValid()
                ) {

                    map.fitBounds(
                        bounds,
                        {
                            padding:
                                [30,30]
                        }
                    );

                }


                alert(
                    'A GeoJSON fájl sikeresen betöltve.'
                );

            }

            catch(error) {

                console.error(
                    error
                );


                alert(
                    'Hiba a GeoJSON fájl beolvasásakor.'
                );

            }

        };


        reader.readAsText(
            file
        );

    }
);


/* =========================================
   CHATGPT GEOJSON
========================================= */

let chatGPTLayerNumber =
    0;


function cleanChatGPTGeoJSON(
    text
) {

    let cleaned =
        text.trim();


    if (
        cleaned.startsWith('```')
    ) {

        cleaned =
            cleaned.replace(
                /^```(?:json|geojson)?\s*/i,
                ''
            );


        cleaned =
            cleaned.replace(
                /\s*```$/,
                ''
            );

    }


    return cleaned.trim();

}


function loadChatGPTGeoJSON() {

    const textarea =
        document.getElementById(
            'chatGPTGeoJSON'
        );


    const status =
        document.getElementById(
            'chatGPTStatus'
        );


    const text =
        cleanChatGPTGeoJSON(
            textarea.value
        );


    if (!text) {

        status.innerHTML =
            '⚠️ Nincs beillesztett GeoJSON.';

        status.style.color =
            '#a33';

        return;

    }


    let data;


    try {

        data =
            JSON.parse(
                text
            );

    }

    catch(error) {

        status.innerHTML =
            '❌ Hibás JSON / GeoJSON formátum.';

        status.style.color =
            '#a33';

        return;

    }


    chatGPTGeoJSONLayer.clearLayers();


    const layer =
        createGeoJSONLayer(
            data
        );


    chatGPTGeoJSONLayer.addLayer(
        layer
    );


    map.addLayer(
        chatGPTGeoJSONLayer
    );


    chatGPTLayerNumber++;


    layerControl.addOverlay(
        chatGPTGeoJSONLayer,
        '🤖 ChatGPT GeoJSON ' +
        chatGPTLayerNumber
    );


    try {

        const bounds =
            layer.getBounds();


        if (
            bounds.isValid()
        ) {

            map.fitBounds(
                bounds,
                {
                    padding:
                        [40,40]
                }
            );

        }

    }

    catch(error) {

        console.log(
            error
        );

    }


    status.innerHTML =
        '✅ GeoJSON sikeresen betöltve a térképre.';

    status.style.color =
        '#176b3a';

}

/* =========================================
   GEOJSON.IO-SZERŰ SZERKESZTŐ
========================================= */

let editorSelectedLayer =
    null;


function editorAttachLayer(
    layer
) {

    layer.on(
        'click',
        function(e) {

            L.DomEvent.stopPropagation(
                e
            );


            editorSelectedLayer =
                layer;


            const properties =
                (
                    layer.feature &&
                    layer.feature.properties
                )
                ?
                layer.feature.properties
                :
                {};


            document.getElementById(
                'editorName'
            ).value =
                properties.name || '';


            document.getElementById(
                'editorDescription'
            ).value =
                properties.description || '';


            document.getElementById(
                'editorStatus'
            ).textContent =
                '✏️ Kijelölve: ' +
                (
                    properties.name ||
                    'névtelen objektum'
                );

        }
    );

}


/* =========================================
   TULAJDONSÁGOK MENTÉSE
========================================= */

function editorSave() {

    if (
        !editorSelectedLayer
    ) {

        alert(
            'Először kattints egy rajzolt objektumra.'
        );

        return;

    }


    editorSelectedLayer.feature =
        editorSelectedLayer.feature ||
        {
            type:
                'Feature',

            properties:
                {}
        };


    editorSelectedLayer.feature.properties =
        editorSelectedLayer.feature.properties ||
        {};


    const name =
        document.getElementById(
            'editorName'
        ).value.trim();


    const description =
        document.getElementById(
            'editorDescription'
        ).value.trim();


    editorSelectedLayer
        .feature
        .properties
        .name =
            name;


    editorSelectedLayer
        .feature
        .properties
        .description =
            description;


    if (
        name
    ) {

        editorSelectedLayer.bindTooltip(
            name,
            {
                direction:
                    'top'
            }
        );

    }


    document.getElementById(
        'editorStatus'
    ).textContent =
        '✅ Tulajdonságok mentve.';

}


/* =========================================
   OBJEKTUM TÖRLÉSE
========================================= */

function editorDelete() {

    if (
        !editorSelectedLayer
    ) {

        alert(
            'Először válassz ki egy objektumot.'
        );

        return;

    }


    drawnItems.removeLayer(
        editorSelectedLayer
    );


    editorSelectedLayer =
        null;


    document.getElementById(
        'editorName'
    ).value =
        '';


    document.getElementById(
        'editorDescription'
    ).value =
        '';


    document.getElementById(
        'editorStatus'
    ).textContent =
        '🗑️ Objektum törölve.';


    editorRefresh();

}


/* =========================================
   GEOJSON FRISSÍTÉSE
========================================= */

function editorRefresh() {

    const code =
        document.getElementById(
            'editorGeoJSON'
        );


    if (
        code
    ) {

        code.value =
            JSON.stringify(
                drawnItems.toGeoJSON(),
                null,
                2
            );

    }

}


/* =========================================
   GEOJSON ALKALMAZÁSA
========================================= */

function editorApply() {

    const code =
        document.getElementById(
            'editorGeoJSON'
        );


    const status =
        document.getElementById(
            'editorStatus'
        );


    let data;


    try {

        data =
            JSON.parse(
                code.value
            );

    }

    catch(error) {

        status.textContent =
            '❌ Hibás GeoJSON.';

        return;

    }


    drawnItems.clearLayers();


    const layer =
        L.geoJSON(
            data
        );


    layer.eachLayer(
        function(child) {

            drawnItems.addLayer(
                child
            );


            editorAttachLayer(
                child
            );

        }
    );


    if (
        layer.getLayers().length
    ) {

        const bounds =
            layer.getBounds();


        if (
            bounds.isValid()
        ) {

            map.fitBounds(
                bounds,
                {
                    padding:
                        [30,30]
                }
            );

        }

    }


    status.textContent =
        '✅ GeoJSON alkalmazva.';

}

/* =========================================
   EXPORT
========================================= */

function geojsonExport() {

    const drawn =
        drawnItems.toGeoJSON();


    const imported =
        importedGeoJSON.toGeoJSON();


    const chatGPT =
        chatGPTGeoJSONLayer.toGeoJSON();


    const features = [];


    if (
        drawn &&
        drawn.features
    ) {

        drawn.features.forEach(
            function(feature) {

                features.push(
                    feature
                );

            }
        );

    }


    if (
        imported &&
        imported.features
    ) {

        imported.features.forEach(
            function(feature) {

                features.push(
                    feature
                );

            }
        );

    }


    if (
        chatGPT &&
        chatGPT.features
    ) {

        chatGPT.features.forEach(
            function(feature) {

                features.push(
                    feature
                );

            }
        );

    }


    if (
        features.length === 0
    ) {

        alert(
            'Nincs exportálható objektum.'
        );

        return;

    }


    const finalGeoJSON = {

        type:
            'FeatureCollection',

        features:
            features

    };


    const json =
        JSON.stringify(
            finalGeoJSON,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    'application/geo+json'
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            'a'
        );


    link.href =
        url;


    link.download =
        'karpatalja-atlasz.geojson';


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );

}

<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Földrajzi interaktív térkép – Kárpátalja</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/0.4.2/leaflet.draw.css">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

.map-title {
    position: absolute;
    top: 15px;
    left: 60px;
    z-index: 1000;

    background: rgba(16,38,56,.95);
    color: white;

    padding: 12px 20px;

    border-left: 3px solid #c09d57;
    border-radius: 4px;

    box-shadow: 0 3px 12px rgba(0,0,0,.25);
}

.map-title strong {
    display: block;
    font-family: Georgia, serif;
    font-size: 19px;
}

.map-title span {
    display: block;
    margin-top: 3px;
    color: #d2b56c;
    font-size: 12px;
}

.coordinates-info {
    padding: 7px 10px;
    font: 13px/18px Arial, sans-serif;

    background: rgba(255,255,255,.92);

    box-shadow: 0 0 10px rgba(0,0,0,.2);
    border-radius: 4px;
}

.geojson-import-control {
    background: white;
    padding: 8px 10px;
    border-radius: 4px;

    box-shadow: 0 0 8px rgba(0,0,0,.25);

    cursor: pointer;

    font: 13px Arial, sans-serif;
}

.geojson-import-control:hover {
    background: #eeeeee;
}

.geojson-import-control input {
    display: none;
}

@media(max-width:700px) {

    .map-title {
        left: 55px;
        top: 10px;
        padding: 9px 12px;
    }

    .map-title strong {
        font-size: 15px;
    }

    .map-title span {
        font-size: 10px;
    }

}

</style>
</head>

<body>

<div class="map-title">
    <strong>Kárpátalja</strong>
    <span>🌍 Interaktív földrajzi térkép</span>
</div>

<div id="map"></div>


<!-- LEAFLET -->

<script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/0.4.2/leaflet.draw.js"></script>

<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>


<!-- A ZIP-BEN LÉVŐ ADATOK -->

<script src="./data/line.js"></script>
<script src="./data/point.js"></script>
<script src="./data/polygon.js"></script>
<script src="./data/nepaldata.js"></script>


<script>

/* =========================================================
   TÉRKÉP
========================================================= */

var map = L.map('map').setView(
    [48.20579018144784, 22.644663061560948],
    8
);


/* =========================================================
   ALAPTÉRKÉPEK
========================================================= */

var osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution:
            '&copy; OpenStreetMap contributors'
    }
);

var googleStreets = L.tileLayer(
    'https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
    {
        maxZoom: 20,
        subdomains:
            ['mt0','mt1','mt2','mt3']
    }
);

var googleSat = L.tileLayer(
    'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    {
        maxZoom: 20,
        subdomains:
            ['mt0','mt1','mt2','mt3']
    }
);

var googleTerrain = L.tileLayer(
    'https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}',
    {
        maxZoom: 20,
        subdomains:
            ['mt0','mt1','mt2','mt3']
    }
);

var googleHybrid = L.tileLayer(
    'https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',
    {
        maxZoom: 20,
        subdomains:
            ['mt0','mt1','mt2','mt3']
    }
);

var CyclOSM = L.tileLayer(
    'https://tile.thunderforest.com/cycle/{z}/{x}/{y}.png?apikey=ba624ccccf5448f4946ad3de45173189',
    {
        maxZoom: 20,
        attribution:
            'CyclOSM | OpenStreetMap contributors'
    }
);

var OpenTopoMap = L.tileLayer(
    'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 17,
        attribution:
            'OpenTopoMap | OpenStreetMap contributors'
    }
);

var CartoDB_DarkMatter = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {
        maxZoom: 19,
        subdomains:
            ['a','b','c','d'],
        attribution:
            'OpenStreetMap contributors & CARTO'
    }
);

var Stamen_Watercolor = L.tileLayer(
    'https://stamen-tiles-{s}.a.ssl.fastly.net/watercolor/{z}/{x}/{y}.{ext}',
    {
        subdomains: 'abcd',
        minZoom: 1,
        maxZoom: 16,
        ext: 'jpg',
        attribution:
            'Stamen Design | OpenStreetMap'
    }
);

osm.addTo(map);


/* =========================================================
   KOORDINÁTÁK
========================================================= */

var coordinatesControl =
    L.control({
        position: 'bottomright'
    });

coordinatesControl.onAdd =
function() {

    this._div =
        L.DomUtil.create(
            'div',
            'coordinates-info'
        );

    this.update();

    return this._div;
};

coordinatesControl.update =
function(latlng) {

    if(latlng) {

        this._div.innerHTML =
            '<strong>Szélesség:</strong> ' +
            latlng.lat.toFixed(6) +
            ' &nbsp; ' +
            '<strong>Hosszúság:</strong> ' +
            latlng.lng.toFixed(6);

    } else {

        this._div.innerHTML =
            'Mutasson a térképre!';

    }

};

coordinatesControl.addTo(map);

map.on(
    'mousemove',
    function(e) {

        coordinatesControl.update(
            e.latlng
        );

    }
);


/* =========================================================
   MÉRÉSI SKÁLA
========================================================= */

L.control.scale({
    position: 'bottomleft',
    metric: true,
    imperial: false,
    maxWidth: 200
}).addTo(map);


/* =========================================================
   A ZIP MEGLÉVŐ ADATAI
========================================================= */

var zipPontok =
    L.geoJSON(
        pointJSON,
        {
            onEachFeature:
            function(feature, layer) {

                if(
                    feature.properties &&
                    feature.properties.name
                ) {

                    layer.bindPopup(
                        '<strong>' +
                        feature.properties.name +
                        '</strong>'
                    );

                }

            }
        }
    );


var zipVonalak =
    L.geoJSON(
        lineJSON
    );


var zipPoligonok =
    L.geoJSON(
        polygonJSON,
        {

            onEachFeature:
            function(feature, layer) {

                if(
                    feature.properties &&
                    feature.properties.name
                ) {

                    layer.bindPopup(
                        '<strong>' +
                        feature.properties.name +
                        '</strong>'
                    );

                }

            }

        }
    );


var zipTerkepek =
    L.geoJSON(
        nepaldataa
    );


/* =========================================================
   FÖLDRAJZI RÉTEGEK
========================================================= */

var domborzat =
    L.layerGroup();

var foldtan =
    L.layerGroup();

var vizrajz =
    L.layerGroup();

var eghajlat =
    L.layerGroup();

var talaj =
    L.layerGroup();

var novenyzet =
    L.layerGroup();

var allatvilag =
    L.layerGroup();

var tajak =
    L.layerGroup();

var termeszetvedelem =
    L.layerGroup();

var termeszetiEroforrasok =
    L.layerGroup();

var termeszetiVeszelyek =
    L.layerGroup();

var telepulesek =
    L.layerGroup();

var kozigazgatas =
    L.layerGroup();


/* =========================================================
   A ZIP ADATAI MEGMARADNAK
========================================================= */

zipPontok.addTo(
    telepulesek
);

zipVonalak.addTo(
    domborzat
);

zipPoligonok.addTo(
    tajak
);


/* =========================================================
   SAJÁT / IMPORTÁLT GEOJSON RÉTEGEK
========================================================= */

var importedGeoJSON =
    L.layerGroup();


/* =========================================================
   RÉTEGEK
========================================================= */

var baseLayers = {

    "🗺️ OpenStreetMap":
        osm,

    "🗺️ Google Térkép":
        googleStreets,

    "🛰️ Műhold":
        googleSat,

    "⛰️ Google Terep":
        googleTerrain,

    "🛰️ Google Hybrid":
        googleHybrid,

    "🚲 CyclOSM":
        CyclOSM,

    "🏔️ OpenTopoMap":
        OpenTopoMap,

    "🎨 Water Color":
        Stamen_Watercolor,

    "🌑 Dark Matter":
        CartoDB_DarkMatter

};


var overlays = {

    "🌄 Domborzat":
        domborzat,

    "🪨 Földtan":
        foldtan,

    "🌊 Vízrajz":
        vizrajz,

    "🌤️ Éghajlat":
        eghajlat,

    "🌱 Talaj":
        talaj,

    "🌲 Növényzet":
        novenyzet,

    "🦌 Állatvilág":
        allatvilag,

    "🏔️ Tájak":
        tajak,

    "🌿 Természetvédelem":
        termeszetvedelem,

    "⛏️ Természeti erőforrások":
        termeszetiEroforrasok,

    "⚠️ Természeti veszélyek":
        termeszetiVeszelyek,

    "🏘️ Települések":
        telepulesek,

    "🏛️ Közigazgatás":
        kozigazgatas,

    "🗺️ ZIP térképi adatok":
        zipTerkepek,

    "📥 Importált GeoJSON":
        importedGeoJSON

};


L.control.layers(
    baseLayers,
    overlays,
    {
        collapsed: false
    }
).addTo(map);


/* =========================================================
   GEOJSON IMPORT KONTROLL
========================================================= */

var GeoJSONImportControl =
    L.Control.extend({

        options: {
            position:
                'topright'
        },

        onAdd:
        function(map) {

            var container =
                L.DomUtil.create(
                    'div',
                    'geojson-import-control'
                );

            container.innerHTML =
                '📥 Import GeoJSON';

            var input =
                L.DomUtil.create(
                    'input'
                );

            input.type =
                'file';

            input.accept =
                '.geojson,.json,application/geo+json,application/json';

            container.appendChild(
                input
            );


            L.DomEvent.disableClickPropagation(
                container
            );


            L.DomEvent.on(
                container,
                'click',
                function() {

                    input.click();

                }
            );


            L.DomEvent.on(
                input,
                'change',
                function(e) {

                    importGeoJSON(
                        e.target.files[0]
                    );

                }
            );


            return container;

        }

    });


map.addControl(
    new GeoJSONImportControl()
);


/* =========================================================
   GEOJSON IMPORT FUNKCIÓ
========================================================= */

function importGeoJSON(file) {

    if(!file) {
        return;
    }


    var reader =
        new FileReader();


    reader.onload =
    function(event) {

        try {

            var geojson =
                JSON.parse(
                    event.target.result
                );


            var layer =
                L.geoJSON(
                    geojson,
                    {

                        onEachFeature:
                        function(
                            feature,
                            layer
                        ) {

                            var properties =
                                feature.properties;


                            if(
                                properties
                            ) {

                                var html =
                                    '<strong>GeoJSON adat</strong><br>';

                                for(
                                    var key in properties
                                ) {

                                    html +=
                                        '<b>' +
                                        key +
                                        ':</b> ' +
                                        properties[key] +
                                        '<br>';

                                }

                                layer.bindPopup(
                                    html
                                );

                            }

                        }

                    }
                );


            importedGeoJSON.clearLayers();

            importedGeoJSON.addLayer(
                layer
            );


            if(
                layer.getBounds &&
                layer.getBounds().isValid()
            ) {

                map.fitBounds(
                    layer.getBounds(),
                    {
                        padding:
                            [30,30]
                    }
                );

            }


            alert(
                'A GeoJSON sikeresen betöltve.'
            );

        }

        catch(error) {

            alert(
                'Hiba: a GeoJSON fájl nem olvasható.'
            );

            console.error(
                error
            );

        }

    };


    reader.readAsText(
        file
    );

}


/* =========================================================
   RAJZOLÁS
========================================================= */

var drawnItems =
    new L.FeatureGroup();

map.addLayer(
    drawnItems
);


var drawControl =
    new L.Control.Draw({

        edit: {
            featureGroup:
                drawnItems
        },

        draw: {

            circle:
                false,

            circlemarker:
                false,

            polygon: {
                allowIntersection:
                    false,
                showArea:
                    true
            }

        }

    });


map.addControl(
    drawControl
);


/* =========================================================
   RAJZOLÁS ESEMÉNY
========================================================= */

map.on(
    L.Draw.Event.CREATED,
    function(event) {

        var layer =
            event.layer;

        drawnItems.addLayer(
            layer
        );

    }
);


/* =========================================================
   GEOJSON EXPORT
========================================================= */

var exportControl =
    L.control({
        position:
            'bottomright'
    });


exportControl.onAdd =
function() {

    var div =
        L.DomUtil.create(
            'div',
            'geojson-import-control'
        );

    div.innerHTML =
        '📤 GeoJSON export';


    L.DomEvent.on(
        div,
        'click',
        function() {

            var data =
                drawnItems.toGeoJSON();


            if(
                data.features.length === 0
            ) {

                alert(
                    'Nincs exportálható saját rajz.'
                );

                return;

            }


            var blob =
                new Blob(
                    [
                        JSON.stringify(
                            data,
                            null,
                            2
                        )
                    ],
                    {
                        type:
                            'application/json'
                    }
                );


            var url =
                URL.createObjectURL(
                    blob
                );


            var a =
                document.createElement(
                    'a'
                );

            a.href =
                url;

            a.download =
                'karpatalja-foldrajzi.geojson';

            a.click();


            URL.revokeObjectURL(
                url
            );

        }
    );


    return div;

};


map.addControl(
    exportControl
);


/* =========================================================
   KERESŐ
========================================================= */

L.Control.geocoder({
    defaultMarkGeocode:
        true
}).addTo(map);


/* =========================================================
   TÉRKÉP FRISSÍTÉS
========================================================= */

setTimeout(
    function() {

        map.invalidateSize();

    },
    500
);

</script>

</body>
</html>

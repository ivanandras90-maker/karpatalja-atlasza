<!-- =====================================================
     A ZIP EREDETI ADATFÁJLJAI
     
     FONTOS:
     A data mappának ugyanott kell lennie,
     ahol ez a HTML fájl van.
===================================================== -->

<script src="./data/line.js"></script>

<script>


/* =====================================================
   TÉRKÉP
===================================================== */

var map =

    L.map('map', {

        zoomControl: true

    }).setView(

        [
            48.20579018144784,
            22.644663061560948
        ],

        8

    );


/* =====================================================
   OPENSTREETMAP
===================================================== */

var osm =

    L.tileLayer(

        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

        {

            maxZoom:
                19,

            attribution:
                '&copy; OpenStreetMap contributors'

        }

    );


osm.addTo(map);


/* =====================================================
   CYClOSM
===================================================== */

var CyclOSM =

    L.tileLayer(

        'https://tile.thunderforest.com/cycle/{z}/{x}/{y}.png?apikey=ba624ccccf5448f4946ad3de45173189',

        {

            maxZoom:
                20,

            attribution:
                'CyclOSM | OpenStreetMap contributors'

        }

    );


/* =====================================================
   OPENTOPO
===================================================== */

var OpenTopoMap =

    L.tileLayer(

        'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',

        {

            maxZoom:
                17,

            attribution:
                'OpenTopoMap | OpenStreetMap contributors'

        }

    );


/* =====================================================
   DARK MATTER
===================================================== */

var CartoDB_DarkMatter =

    L.tileLayer(

        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',

        {

            maxZoom:
                19,

            subdomains:
                [
                    'a',
                    'b',
                    'c',
                    'd'
                ],

            attribution:
                'OpenStreetMap contributors & CARTO'

        }

    );


/* =====================================================
   GOOGLE MAP
===================================================== */

var googleStreets =

    L.tileLayer(

        'https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',

        {

            maxZoom:
                20,

            subdomains:
                [
                    'mt0',
                    'mt1',
                    'mt2',
                    'mt3'
                ]

        }

    );


/* =====================================================
   GOOGLE MŰHOLD
===================================================== */

var googleSat =

    L.tileLayer(

        'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',

        {

            maxZoom:
                20,

            subdomains:
                [
                    'mt0',
                    'mt1',
                    'mt2',
                    'mt3'
                ]

        }

    );


/* =====================================================
   GOOGLE TERRAIN
===================================================== */

var googleTerrain =

    L.tileLayer(

        'https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}',

        {

            maxZoom:
                20,

            subdomains:
                [
                    'mt0',
                    'mt1',
                    'mt2',
                    'mt3'
                ]

        }

    );


/* =====================================================
   GOOGLE HYBRID
===================================================== */

var googleHybrid =

    L.tileLayer(

        'https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',

        {

            maxZoom:
                20,

            subdomains:
                [
                    'mt0',
                    'mt1',
                    'mt2',
                    'mt3'
                ]

        }

    );


/* =====================================================
   STAMEN WATERCOLOR
===================================================== */

var Stamen_Watercolor =

    L.tileLayer(

        'https://stamen-tiles-{s}.a.ssl.fastly.net/watercolor/{z}/{x}/{y}.{ext}',

        {

            subdomains:
                'abcd',

            minZoom:
                1,

            maxZoom:
                16,

            ext:
                'jpg',

            attribution:
                'Stamen Design | OpenStreetMap contributors'

        }

    );


/* =====================================================
   MARKER – EREDETI ZIP FUNKCIÓ
===================================================== */

var singleMarker =

    L.marker(

        [
            48.20579018144784,
            22.644663061560948
        ]

    );


var markerPopup =

    singleMarker.bindPopup(
        'Kárpátalja'
    );


/* =====================================================
   KOORDINÁTÁK
   ALUL KÖZÉPEN
===================================================== */

var coordinatesControl =

    L.control({

        position:
            'bottomleft'

    });


coordinatesControl.onAdd =

function() {

    this._div =

        L.DomUtil.create(

            'div',

            'coordinates-info'

        );


    this._div.innerHTML =
        'Mutasson a térképre!';


    return this._div;

};


coordinatesControl.update =

function(latlng) {

    if(latlng) {

        this._div.innerHTML =

            '<strong>Lat:</strong> ' +

            latlng.lat.toFixed(6) +

            '&nbsp;&nbsp;&nbsp;' +

            '<strong>Lng:</strong> ' +

            latlng.lng.toFixed(6);

    }

};


coordinatesControl.addTo(map);


/* KÖZÉPRE HELYEZÉS */

var coordinateContainer =

    coordinatesControl.getContainer();


coordinateContainer.style.position =
    'absolute';

coordinateContainer.style.left =
    '50%';

coordinateContainer.style.bottom =
    '10px';

coordinateContainer.style.transform =
    'translateX(-50%)';

coordinateContainer.style.margin =
    '0';

coordinateContainer.style.zIndex =
    '1000';


map.on(

    'mousemove',

    function(e) {

        coordinatesControl.update(
            e.latlng
        );

    }

);


/* =====================================================
   SKÁLA
===================================================== */

L.control.scale({

    position:
        'bottomleft',

    metric:
        true,

    imperial:
        false,

    maxWidth:
        200

}).addTo(map);


/* =====================================================
   ZIP GEOJSON
===================================================== */

var linedata =

    L.geoJSON(
        lineJSON
    );


var pointdata =

    L.geoJSON(
        pointJSON
    );


var nepalData =

    L.geoJSON(
        nepaldataa
    );


var polygondata =

    L.geoJSON(

        polygonJSON,

        {

            onEachFeature:

            function(
                feature,
                layer
            ) {

                if(

                    feature.properties &&

                    feature.properties.name

                ) {

                    layer.bindPopup(

                        '<b>' +

                        feature.properties.name +

                        '</b>'

                    );

                }

            },

            style: {

                fillColor:
                    'red',

                fillOpacity:
                    0.5,

                color:
                    'green',

                weight:
                    2

            }

        }

    );


/* =====================================================
   USSTATES
===================================================== */

var usstatesData =

    L.geoJSON(

        statesData,

        {

            style: {

                color:
                    '#555',

                weight:
                    1,

                fillOpacity:
                    0.15

            },

            onEachFeature:

            function(
                feature,
                layer
            ) {

                if(

                    feature.properties &&

                    feature.properties.name

                ) {

                    layer.bindPopup(

                        '<b>' +

                        feature.properties.name +

                        '</b>'

                    );

                }

            }

        }

    );


/* =====================================================
   BEREG VÁRMEGYE
===================================================== */

var beregData =

    L.geoJSON(

        beregvmJSON,

        {

            style: {

                color:
                    '#8b0000',

                weight:
                    2,

                fillOpacity:
                    0.15

            }

        }

    );


/* =====================================================
   TERMÉSZETFÖLDRAJZI RÉTEGEK
===================================================== */

var relief =
    L.layerGroup();

var mountains =
    L.layerGroup();

var rivers =
    L.layerGroup();

var lakes =
    L.layerGroup();

var geology =
    L.layerGroup();

var climate =
    L.layerGroup();

var soils =
    L.layerGroup();

var vegetation =
    L.layerGroup();

var wildlife =
    L.layerGroup();

var landscapes =
    L.layerGroup();

var natureProtection =
    L.layerGroup();

var naturalResources =
    L.layerGroup();

var naturalHazards =
    L.layerGroup();


/* =====================================================
   FÖLDRAJZI ALAP RÉTEGEK
===================================================== */

var settlements =
    L.layerGroup();

var roads =
    L.layerGroup();

var administrativeBoundaries =
    L.layerGroup();


/* =====================================================
   ZIP RÉTEGEK
===================================================== */

pointdata.addTo(
    settlements
);

linedata.addTo(
    roads
);

polygondata.addTo(
    landscapes
);

usstatesData.addTo(
    administrativeBoundaries
);

beregData.addTo(
    administrativeBoundaries
);


/* =====================================================
   IMPORTÁLT GEOJSON
===================================================== */

var importedGeoJSON =
    L.layerGroup();


/* =====================================================
   RÉTEGEK
   JOBB ALSÓ SAROK
===================================================== */

var baseLayers = {

    "🗺️ OpenStreetMap":
        osm,

    "🛰️ Satellite":
        googleSat,

    "🗺️ Google Map":
        googleStreets,

    "⛰️ Google Terrain":
        googleTerrain,

    "🛰️ Google Hybrid":
        googleHybrid,

    "🚲 CyclOSM":
        CyclOSM,

    "🏔️ OpenTopoMap":
        OpenTopoMap,

    "🎨 Water Color":
        Stamen_Watercolor,

    "🌑 Dark Matter":
        CartoDB_DarkMatter

};


var overlays = {

    "📍 Marker":
        singleMarker,

    "🏔️ Domborzat":
        relief,

    "⛰️ Hegységek":
        mountains,

    "🪨 Földtan":
        geology,

    "🌊 Vízrajz":
        rivers,

    "💧 Tavak":
        lakes,

    "🌤️ Éghajlat":
        climate,

    "🌱 Talaj":
        soils,

    "🌲 Növényzet":
        vegetation,

    "🦌 Állatvilág":
        wildlife,

    "🏔️ Tájak":
        landscapes,

    "🌿 Természetvédelem":
        natureProtection,

    "⛏️ Természeti erőforrások":
        naturalResources,

    "⚠️ Természeti veszélyek":
        naturalHazards,

    "🏘️ Települések":
        settlements,

    "🛣️ Utak":
        roads,

    "🏛️ Közigazgatási határok":
        administrativeBoundaries,

    "📍 ZIP – PointData":
        pointdata,

    "〰️ ZIP – LineData":
        linedata,

    "⬟ ZIP – PolygonData":
        polygondata,

    "🗺️ ZIP – NepalData":
        nepalData,

    "🇺🇸 ZIP – States":
        usstatesData,

    "🏛️ ZIP – Bereg vármegye":
        beregData,

    "📥 Importált GeoJSON":
        importedGeoJSON

};


/* =====================================================
   LAYER CONTROL
===================================================== */

L.control.layers(

    baseLayers,

    overlays,

    {

        collapsed:
            false,

        position:
            'bottomright'

    }

).addTo(map);


/* =====================================================
   IMPORT GEOJSON
   BAL FELSŐ
===================================================== */

var importControl =

    L.control({

        position:
            'topleft'

    });


importControl.onAdd =

function() {

    var container =

        L.DomUtil.create(

            'div',

            'leaflet-bar'

        );


    var button =

        L.DomUtil.create(

            'button',

            'map-tool-button',

            container

        );


    button.type =
        'button';

    button.innerHTML =
        '📥 Import GeoJSON';

    button.title =
        'GeoJSON import';


    var input =

        document.createElement(
            'input'
        );


    input.type =
        'file';


    input.accept =
        '.geojson,.json,application/geo+json,application/json';


    input.style.display =
        'none';


    container.appendChild(
        input
    );


    L.DomEvent.disableClickPropagation(
        container
    );


    L.DomEvent.on(

        button,

        'click',

        function() {

            input.click();

        }

    );


    L.DomEvent.on(

        input,

        'change',

        function(event) {

            var file =
                event.target.files[0];


            if(!file) {

                return;

            }


            var reader =
                new FileReader();


            reader.onload =

            function(e) {

                try {

                    var geojson =

                        JSON.parse(
                            e.target.result
                        );


                    var imported =

                        L.geoJSON(

                            geojson,

                            {

                                onEachFeature:

                                function(
                                    feature,
                                    layer
                                ) {

                                    if(
                                        feature.properties
                                    ) {

                                        var html =

                                            '<strong>' +

                                            'GeoJSON objektum' +

                                            '</strong><br>';


                                        Object.keys(

                                            feature.properties

                                        ).forEach(

                                            function(key) {

                                                html +=

                                                    '<b>' +

                                                    key +

                                                    ':</b> ' +

                                                    feature.properties[key] +

                                                    '<br>';

                                            }

                                        );


                                        layer.bindPopup(
                                            html
                                        );

                                    }

                                }

                            }

                        );


                    importedGeoJSON.clearLayers();


                    importedGeoJSON.addLayer(
                        imported
                    );


                    map.addLayer(
                        importedGeoJSON
                    );


                    if(

                        imported.getBounds &&

                        imported.getBounds().isValid()

                    ) {

                        map.fitBounds(

                            imported.getBounds(),

                            {

                                padding:
                                    [30,30]

                            }

                        );

                    }


                    alert(
                        'A GeoJSON sikeresen betöltve.'
                    );

                }

                catch(error) {

                    console.error(
                        error
                    );

                    alert(
                        'Hiba: érvénytelen GeoJSON fájl.'
                    );

                }


                input.value =
                    '';

            };


            reader.readAsText(
                file
            );

        }

    );


    return container;

};


importControl.addTo(
    map
);


/* =====================================================
   DRAW
   IMPORT ALATT
===================================================== */

var drawnItems =

    new L.FeatureGroup();


map.addLayer(
    drawnItems
);


var drawControl =

    new L.Control.Draw(

        {

            position:
                'topleft',

            edit: {

                featureGroup:
                    drawnItems

            },

            draw: {

                polygon: {

                    allowIntersection:
                        false,

                    showArea:
                        true

                },

                polyline:
                    true,

                rectangle:
                    true,

                marker:
                    true,

                circle:
                    false,

                circlemarker:
                    false

            }

        }

    );


map.addControl(
    drawControl
);


/* =====================================================
   DRAW INFORMÁCIÓ
===================================================== */

var _round =

function(
    num,
    len
) {

    return Math.round(

        num *
        Math.pow(
            10,
            len
        )

    )
    /
    Math.pow(
        10,
        len
    );

};


var strLatLng =

function(
    latlng
) {

    return '(' +

        _round(
            latlng.lat,
            6
        ) +

        ', ' +

        _round(
            latlng.lng,
            6
        ) +

        ')';

};


/* =====================================================
   DRAW POPUP
===================================================== */

var getPopupContent =

function(layer) {


    /* Marker */

    if(

        layer instanceof L.Marker ||

        layer instanceof L.CircleMarker

    ) {

        return strLatLng(

            layer.getLatLng()

        );

    }


    /* Circle */

    if(

        layer instanceof L.Circle

    ) {

        var center =
            layer.getLatLng();


        var radius =
            layer.getRadius();


        return (

            'Középpont: ' +

            strLatLng(
                center
            ) +

            '<br>' +

            'Sugár: ' +

            _round(
                radius,
                2
            ) +

            ' m'

        );

    }


    /* Polygon */

    if(

        layer instanceof L.Polygon

    ) {

        return 'Poligon';

    }


    /* Polyline */

    if(

        layer instanceof L.Polyline

    ) {

        var latlngs =
            layer.getLatLngs();


        var distance =
            0;


        if(

            latlngs.length < 2

        ) {

            return 'Távolság: N/A';

        }


        for(

            var i = 0;

            i < latlngs.length - 1;

            i++

        ) {

            distance +=

                latlngs[i].distanceTo(

                    latlngs[i + 1]

                );

        }


        if(

            _round(
                distance,
                2
            ) > 1000

        ) {

            return (

                'Távolság: ' +

                _round(
                    distance,
                    2
                ) / 1000 +

                ' km'

            );

        }


        return (

            'Távolság: ' +

            _round(
                distance,
                2
            ) +

            ' m'

        );

    }


    return null;

};


/* =====================================================
   DRAW – LÉTREHOZÁS
===================================================== */

map.on(

    L.Draw.Event.CREATED,

    function(event) {

        var layer =
            event.layer;


        var content =
            getPopupContent(
                layer
            );


        if(
            content !== null
        ) {

            layer.bindPopup(
                content
            );

        }


        var feature =
            layer.feature =
            layer.feature || {};


        feature.type =
            'Feature';


        var props =
            feature.properties =
            feature.properties || {};


        props.info =
            content;


        drawnItems.addLayer(
            layer
        );

    }

);


/* =====================================================
   DRAW – SZERKESZTÉS
===================================================== */

map.on(

    L.Draw.Event.EDITED,

    function(event) {

        event.layers.eachLayer(

            function(layer) {

                var content =
                    getPopupContent(
                        layer
                    );


                if(
                    content !== null
                ) {

                    layer.setPopupContent(
                        content
                    );

                }


                var feature =
                    layer.feature =
                    layer.feature || {};


                feature.type =
                    'Feature';


                var props =
                    feature.properties =
                    feature.properties || {};


                props.info =
                    content;

            }

        );

    }

);


/* =====================================================
   EXPORT GEOJSON
   BAL FELSŐ
===================================================== */

var exportControl =

    L.control({

        position:
            'topleft'

    });


exportControl.onAdd =

function() {

    var container =

        L.DomUtil.create(

            'div',

            'leaflet-bar'

        );


    var button =

        L.DomUtil.create(

            'button',

            'map-tool-button',

            container

        );


    button.type =
        'button';


    button.innerHTML =
        '📤 Export GeoJSON';


    button.title =
        'GeoJSON export';


    L.DomEvent.disableClickPropagation(
        container
    );


    L.DomEvent.on(

        button,

        'click',

        function() {

            var jsonData =

                JSON.stringify(

                    drawnItems.toGeoJSON(),

                    null,

                    2

                );


            if(

                drawnItems.getLayers().length === 0

            ) {

                alert(

                    'Nincs exportálható rajz.'

                );

                return;

            }


            var dataUri =

                'data:application/geo+json;charset=utf-8,' +

                encodeURIComponent(
                    jsonData
                );


            var date =
                new Date();


            var filename =

                'karpatalja_foldrajzi_' +

                date
                    .toISOString()
                    .slice(0,10) +

                '.geojson';


            var link =

                document.createElement(
                    'a'
                );


            link.href =
                dataUri;


            link.download =
                filename;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );

        }

    );


    return container;

};


exportControl.addTo(
    map
);


/* =====================================================
   KERESŐ
===================================================== */

if(

    L.Control &&
    L.Control.Geocoder

) {

    L.Control.geocoder({

        defaultMarkGeocode:
            true

    }).addTo(map);

}


/* =====================================================
   TELJES KÉPERNYŐ
   JOBB FELSŐ
===================================================== */

var fullscreenControl =

    L.control({

        position:
            'topright'

    });


fullscreenControl.onAdd =

function() {

    var container =

        L.DomUtil.create(

            'div',

            'leaflet-bar'

        );


    var button =

        L.DomUtil.create(

            'button',

            'map-tool-button',

            container

        );


    button.type =
        'button';


    button.innerHTML =
        '⛶';


    button.title =
        'Teljes képernyő';


    L.DomEvent.disableClickPropagation(
        container
    );


    L.DomEvent.on(

        button,

        'click',

        function() {

            if(

                !document.fullscreenElement

            ) {

                if(

                    document
                        .documentElement
                        .requestFullscreen

                ) {

                    document
                        .documentElement
                        .requestFullscreen();

                }

            }

            else {

                if(
                    document.exitFullscreen
                ) {

                    document.exitFullscreen();

                }

            }

        }

    );


    return container;

};


fullscreenControl.addTo(
    map
);


/* =====================================================
   FULLSCREEN MÉRETFRISSÍTÉS
===================================================== */

document.addEventListener(

    'fullscreenchange',

    function() {

        setTimeout(

            function() {

                map.invalidateSize();

            },

            300

        );

    }

);


/* =====================================================
   TÉRKÉP MÉRETFRISSÍTÉS
===================================================== */

setTimeout(

    function() {

        map.invalidateSize();

    },

    500

);

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>Kárpátalja Földrajzi és Történeti Atlasza</title>

<link

<style>

/* =====================================================
   ALAP
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f3f0e7;
}


/* =====================================================
   FEJLÉC
===================================================== */

header {
    background: #102638;
    color: white;
    padding: 20px 35px;
    border-bottom: 1px solid #c09d57;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 6px 0 0;
    color: #c9ad6c;
    font-size: 14px;
}


/* =====================================================
   NYELV
===================================================== */

.language-switch {
    margin-top: 12px;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.language-switch span,
.language-switch a {
    margin-right: 12px;
}

.language-switch a {
    color: white;
    text-decoration: none;
}

.current-language {
    color: #d8b86a;
    font-weight: bold;
}


/* =====================================================
   NAV
===================================================== */

nav {
    background: #17374d;
    padding: 0 35px;
}

nav a {
    display: inline-block;
    padding: 15px;
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
}

nav a:hover {
    background: #c09d57;
    color: #102638;
}


/* =====================================================
   TÉRKÉP FEJLÉC
===================================================== */

.map-header {
    background: #f3f0e7;
    padding: 20px 35px;
}

.map-header h2 {
    margin: 0 0 8px;
    color: #17374d;
    font-size: 28px;
}

.map-header p {
    margin: 0;
    color: #5d666c;
    font-size: 14px;
}


/* =====================================================
   TÉRKÉP
===================================================== */

#map {
    width: 100%;
    height: calc(100vh - 205px);
    min-height: 550px;
}


/* =====================================================
   KOORDINÁTA
===================================================== */

.coordinate-display {
    background: rgba(16,38,56,.95);
    color: white;
    padding: 7px 10px;
    border-radius: 4px;
    font-family: Arial, sans-serif;
    font-size: 11px;
}


/* =====================================================
   GEOJSON VEZÉRLŐ
===================================================== */

.geojson-control {
    background: white;
    padding: 5px;
    border-radius: 4px;
    box-shadow: 0 1px 5px rgba(0,0,0,.35);
    margin-bottom: 5px;
}

.geojson-control button {
    display: block;
    width: 165px;
    border: 0;
    background: white;
    color: #17374d;
    padding: 8px 10px;
    text-align: left;
    cursor: pointer;
    font: bold 11px Arial,sans-serif;
    border-bottom: 1px solid #eee;
}

.geojson-control button:last-child {
    border-bottom: 0;
}

.geojson-control button:hover {
    background: #f0eadb;
}


/* =====================================================
   PREZI GOMB
===================================================== */

.prezi-button {
    background: #c09d57 !important;
    color: #102638 !important;
    font-weight: bold !important;
}


/* =====================================================
   PREZI SZERKESZTŐ
===================================================== */

#preziEditor {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: none;
    background: #e9e5da;
}

#preziEditor.active {
    display: flex;
}


/* BAL OLDALI ESZKÖZTÁR */

.prezi-toolbar {
    width: 190px;
    background: #102638;
    color: white;
    padding: 15px;
    overflow-y: auto;
    flex-shrink: 0;
}

.prezi-brand {
    padding-bottom: 15px;
    margin-bottom: 12px;
    border-bottom: 1px solid #526573;
}

.prezi-brand-title {
    color: #d8b86a;
    font: bold 19px Georgia,serif;
}

.prezi-brand-subtitle {
    color: #cbd4d9;
    font: 9px Arial,sans-serif;
    letter-spacing: 1px;
    margin-top: 3px;
}

.prezi-toolbar button {
    width: 100%;
    padding: 9px 8px;
    margin-bottom: 6px;
    border: 0;
    border-radius: 4px;
    background: #17374d;
    color: white;
    cursor: pointer;
    text-align: left;
    font: bold 11px Arial,sans-serif;
}

.prezi-toolbar button:hover {
    background: #28566d;
}

.prezi-toolbar .gold {
    background: #c09d57;
    color: #102638;
}


/* PREZI MUNKATERÜLET */

.prezi-workspace {
    position: relative;
    flex: 1;
    min-width: 0;
}

#preziMap {
    position: absolute;
    inset: 0;
}


/* JOBB OLDALI DIÁK */

.prezi-frames {
    width: 230px;
    background: #f7f5ef;
    border-left: 1px solid #c8c2b5;
    padding: 12px;
    overflow-y: auto;
    flex-shrink: 0;
}

.prezi-frames-title {
    color: #17374d;
    font: bold 11px Arial,sans-serif;
    letter-spacing: 1px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ccc;
    margin-bottom: 10px;
}

.prezi-frame {
    background: white;
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 11px;
    margin-bottom: 8px;
    cursor: pointer;
}

.prezi-frame:hover {
    border-color: #c09d57;
}

.prezi-frame.active {
    border-color: #c09d57;
    box-shadow: 0 0 0 2px rgba(192,157,87,.25);
}

.prezi-frame-number {
    color: #c09d57;
    font: bold 10px Arial,sans-serif;
}

.prezi-frame-title {
    color: #17374d;
    font: bold 12px Arial,sans-serif;
    margin-top: 4px;
}

.prezi-frame-text {
    color: #777;
    font: 10px Arial,sans-serif;
    line-height: 1.4;
    margin-top: 5px;
}


/* =====================================================
   PREZI SZÖVEGOBJEKTUMOK
===================================================== */

.prezi-object {
    position: absolute;
    z-index: 2000;
    cursor: move;
    user-select: none;
    transform-origin: center center;
}

.prezi-text-object {
    padding: 8px 12px;
    background: rgba(255,255,255,.9);
    border-radius: 5px;
    color: #17374d;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    white-space: pre-wrap;
}

.prezi-object.selected {
    outline: 2px solid #c09d57;
    outline-offset: 4px;
}


/* =====================================================
   PREZI FRAME SZERKESZTŐ
===================================================== */

.prezi-frame-editor {
    position: absolute;
    top: 60px;
    right: 15px;
    width: 285px;
    background: rgba(255,255,255,.98);
    border: 1px solid #c09d57;
    border-radius: 6px;
    padding: 12px;
    z-index: 4000;
    box-shadow: 0 5px 20px rgba(0,0,0,.3);
}

.prezi-frame-editor h3 {
    margin: 0 0 10px;
    color: #17374d;
    font-size: 14px;
}

.prezi-frame-editor label,
.prezi-text-editor label {
    display: block;
    margin: 8px 0 4px;
    color: #526573;
    font: bold 10px Arial,sans-serif;
}

.prezi-frame-editor input,
.prezi-frame-editor textarea,
.prezi-text-editor input,
.prezi-text-editor textarea,
.prezi-text-editor select {

    padding: 7px;
    border: 1px solid #aaa;

}

.prezi-frame-editor textarea {
    min-height: 70px;
    resize: vertical;
}


/* =====================================================
   SZÖVEG SZERKESZTŐ
===================================================== */

.prezi-text-editor {
    position: absolute;
    bottom: 20px;
    right: 15px;
    width: 285px;
    background: rgba(255,255,255,.98);
    border: 1px solid #c09d57;
    border-radius: 6px;
    padding: 12px;
    z-index: 4500;
    box-shadow: 0 5px 20px rgba(0,0,0,.3);
    display: none;
}

.prezi-text-editor.active {
    display: block;
}

.prezi-text-editor h3 {
    margin: 0 0 10px;
    color: #17374d;
    font-size: 14px;
}

.prezi-text-editor textarea {
    min-height: 90px;
    resize: vertical;
}


/* =====================================================
   PREZENTÁCIÓ
===================================================== */

#presentationOverlay {
    position: absolute;
    inset: 0;
    z-index: 9000;
    display: none;
    pointer-events: none;
}

#presentationOverlay.active {
    display: block;
}

.presentation-caption {
    position: absolute;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    width: min(780px,calc(100% - 50px));
    padding: 18px 22px;
    background: rgba(16,38,56,.95);
    color: white;
    border: 1px solid #c09d57;
    border-radius: 8px;
    text-align: center;
    pointer-events: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
}

.presentation-counter {
    color: #d8b86a;
    font: bold 10px Arial,sans-serif;
}

.presentation-caption h1 {
    margin: 5px 0;
    font: 29px Georgia,serif;
}

.presentation-caption p {
    margin: 0;
    color: #e2e6e8;
    font: 13px Arial,sans-serif;
    line-height: 1.5;
}

.presentation-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
}

.presentation-buttons button {
    border: 0;
    border-radius: 4px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: bold;
}


/* =====================================================
   PROFESSZIONÁLIS GALÉRIA MARKEREK
===================================================== */

.gallery-marker-wrap {
    background: transparent;
    border: 0;
}

.gallery-marker {
    width: 38px;
    height: 38px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    background: #102638;
    border: 2px solid #d8b86a;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    justify-content: center;
}

.gallery-marker span {
    transform: rotate(45deg);
    font-size: 17px;
}

.gallery-marker:hover {
    transform: rotate(-45deg) scale(1.08);
}

.gallery-popup {
    min-width: 250px;
    max-width: 310px;
    font-family: Arial,sans-serif;
    color: #26343d;
}

.gallery-popup img {
    display: block;
    width: 100%;
    max-height: 175px;
    object-fit: cover;
    border-radius: 8px;
    margin: 0 0 10px;
}

.gallery-popup h3 {
    margin: 0 0 7px;
    color: #17374d;
    font: 700 17px Georgia,serif;
}

.gallery-popup .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 7px 0;
}

.gallery-popup .badge {
    display: inline-block;
    padding: 4px 7px;
    border-radius: 999px;
    background: #f0eadb;
    color: #17374d;
    font-size: 10px;
    font-weight: 700;
}

.gallery-popup .description {
    line-height: 1.5;
    font-size: 12px;
    margin: 8px 0;
}

.gallery-popup .coords {
    color: #69747b;
    font-size: 10px;
    margin-top: 8px;
}

.gallery-popup .popup-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.gallery-popup .popup-actions a {
    display: inline-block;
    padding: 7px 9px;
    border-radius: 5px;
    background: #102638;
    color: #fff;
    text-decoration: none;
    font-size: 10px;
    font-weight: 700;
}

.gallery-popup .popup-actions a.gold {
    background: #c09d57;
    color: #102638;
}

.map-status {
    background: rgba(16,38,56,.94);
    color: #fff;
    padding: 7px 10px;
    border: 1px solid rgba(216,184,106,.65);
    border-radius: 6px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    font: 11px Arial,sans-serif;
}

.map-status strong {
    color: #d8b86a;
}


/* =====================================================
   MOBIL
===================================================== */

@media(max-width:800px) {

    header {
        padding: 15px;
    }

    }

    }

    nav a {

    }

    }

    }

    }

}

<nav>

<section class="map-header">

    <h2>
        🌍 Interaktív földrajzi térkép
    </h2>

    <p>
        Kárpátalja földrajzi térképe
        természetföldrajzi és történelmi objektumokkal.
    </p>

</section>


<div id="map"></div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js">
</script>


<script>

/* =====================================================
   ALAP TÉRKÉP
===================================================== */

const map =
    L.map("map")
     .setView(
         [48.45,22.75],
         8
     );


/* =====================================================
   OSM
===================================================== */

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    );

osm.addTo(map);


/* =====================================================
   FÖLDRAJZI RÉTEGEK
===================================================== */

const relief =
    L.layerGroup();

const mountains =
    L.layerGroup();

const rivers =
    L.layerGroup();

const lakes =
    L.layerGroup();

const settlements =
    L.layerGroup();

const roads =
    L.layerGroup();

const administrativeBoundaries =
    L.layerGroup();

const geological =
    L.layerGroup();

const climate =
    L.layerGroup();

const soils =
    L.layerGroup();

const vegetation =
    L.layerGroup();

const landscapes =
    L.layerGroup();

const natureProtection =
    L.layerGroup();

const naturalResources =
    L.layerGroup();

const naturalHazards =
    L.layerGroup();


/* =====================================================
   GALÉRIA RÉTEG
===================================================== */

const galleryLayer =
    L.layerGroup();


/* =====================================================
   RÉTEGEK
===================================================== */

const overlays = {

    "🏔️ Domborzat":
        relief,

    "⛰️ Hegységek":
        mountains,

    "🌊 Folyók":
        rivers,

    "💧 Tavak":
        lakes,

    "🏘️ Települések":
        settlements,

    "🛣️ Utak":
        roads,

    "🏛️ Közigazgatási határok":
        administrativeBoundaries,

    "🪨 Földtan":
        geological,

    "🌦️ Éghajlat":
        climate,

    "🌱 Talaj":
        soils,

    "🌲 Növényzet":
        vegetation,

    "🗺️ Tájak":
        landscapes,

    "🌳 Természetvédelem":
        natureProtection,

    "⛏️ Természeti erőforrások":
        naturalResources,

    "⚠️ Természeti veszélyek":
        naturalHazards,

    "📷 Galéria":
        galleryLayer

};


/* =====================================================
   RÉTEGKEZELŐ
===================================================== */

L.control.layers(
    {
        "OpenStreetMap":
            osm
    },
    overlays,
    {
        collapsed:false
    }
).addTo(map);


/* =====================================================
   GALÉRIA BETÖLTÉSE AZ ATLASZ.JSON-BŐL
===================================================== */

async function loadGalleryLayer(){

    try {

        const response =
            await fetch(
                "atlasz.json",
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Az atlasz.json nem tölthető be."
            );

        }

        const data =
            await response.json();

        if(
            !data ||
            typeof data !== "object"
        ){

            throw new Error(
                "Érvénytelen atlasz adatmodell."
            );

        }

        const gallery =
            Array.isArray(data.gallery)
                ? data.gallery
                : [];

        galleryLayer.clearLayers();

        const mappedGallery =
            gallery
                .filter(
                    item => {

                        const lat =
                            Number(
                                item?.latitude
                            );

                        const lng =
                            Number(
                                item?.longitude
                            );

                        return (
                            item &&
                            item.visible !== false &&
                            item.mapVisible !== false &&
                            Number.isFinite(lat) &&
                            Number.isFinite(lng) &&
                            lat >= -90 &&
                            lat <= 90 &&
                            lng >= -180 &&
                            lng <= 180
                        );

                    }
                )
                .sort(
                    (a,b) =>
                        Number(a.order || 0) -
                        Number(b.order || 0)
                );


        mappedGallery.forEach(
            item => {

                const lat =
                    Number(
                        item.latitude
                    );

                const lng =
                    Number(
                        item.longitude
                    );


                const icon =
                    L.divIcon({

                        className:
                            "gallery-marker-wrap",

                        html:
                            '<div class="gallery-marker" title="Galéria kép">' +
                            '<span>📷</span>' +
                            '</div>',

                        iconSize:
                            [38,38],

                        iconAnchor:
                            [19,38],

                        popupAnchor:
                            [0,-34]

                    });


                const marker =
                    L.marker(
                        [lat,lng],
                        {
                            icon,
                            title:
                                item.title ||
                                "Galéria"
                        }
                    );


                const imageHtml =
                    item.image
                        ?
                        `<img
                            src="${escapeHTML(item.image)}"
                            alt="${escapeHTML(
                                item.title ||
                                "Galéria kép"
                            )}"
                            loading="lazy"
                        >`
                        :
                        "";


                const badges =
                    [
                        item.category
                            ?
                            `<span class="badge">
                                ${escapeHTML(item.category)}
                            </span>`
                            :
                            "",

                        item.period
                            ?
                            `<span class="badge">
                                ${escapeHTML(item.period)}
                            </span>`
                            :
                            ""

                    ]
                    .filter(Boolean)
                    .join("");


                const description =
                    item.description
                        ?
                        `<div class="description">
                            ${escapeHTML(item.description)}
                        </div>`
                        :
                        "";


                const source =
                    item.source
                        ?
                        `<div class="description">
                            <strong>Forrás:</strong>
                            ${escapeHTML(item.source)}

                            ${
                                item.sourceDescription
                                    ?
                                    `<br>
                                     <span style="color:#69747b">
                                        ${escapeHTML(
                                            item.sourceDescription
                                        )}
                                     </span>`
                                    :
                                    ""
                            }

                        </div>`
                        :
                        "";


                const sourceLink =
                    item.sourceUrl
                        ?
                        `<a
                            href="${escapeHTML(item.sourceUrl)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Forrás ↗
                        </a>`
                        :
                        "";


                const galleryLink =
                    item.id
                        ?
                        `<a
                            class="gold"
                            href="gallery.html?gallery=${encodeURIComponent(
                                String(item.id)
                            )}"
                        >
                            Galériában megnyitás
                        </a>`
                        :
                        `<a
                            class="gold"
                            href="gallery.html"
                        >
                            Galéria
                        </a>`;


                marker.bindPopup(

                    `<div class="gallery-popup">

                        ${imageHtml}

                        <h3>
                            ${escapeHTML(
                                item.title ||
                                "Galéria"
                            )}
                        </h3>

                        ${
                            badges
                                ?
                                `<div class="meta">
                                    ${badges}
                                 </div>`
                                :
                                ""
                        }

                        ${description}

                        ${source}

                        <div class="coords">
                            Koordináta:
                            ${lat.toFixed(5)},
                            ${lng.toFixed(5)}
                        </div>

                        <div class="popup-actions">

                            ${galleryLink}

                            ${sourceLink}

                        </div>

                    </div>`,

                    {
                        maxWidth:340,
                        minWidth:250,
                        autoPan:true
                    }

                );


                marker.addTo(
                    galleryLayer
                );

            }
        );


        galleryLayer.addTo(
            map
        );


        const status =
            document.querySelector(
                ".map-status-value"
            );


        if(status){

            status.textContent =
                `${mappedGallery.length} térképi galériapont`;

        }


        if(
            mappedGallery.length
        ){

            addGalleryFitControl(
                mappedGallery
            );

        }


        focusGalleryFromUrl(
            mappedGallery
        );


    }
    catch(error){

        console.warn(
            "A galéria térképi rétege nem tölthető be:",
            error
        );


        const status =
            document.querySelector(
                ".map-status-value"
            );


        if(status){

            status.textContent =
                "Galéria adat nem érhető el";

        }

    }

}

function focusGalleryFromUrl(
    gallery
){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const galleryId =
        params.get(
            "gallery"
        );


    const lat =
        Number(
            params.get(
                "lat"
            )
        );


    const lng =
        Number(
            params.get(
                "lng"
            )
        );


    if(
        !galleryId &&
        !(
            Number.isFinite(lat) &&
            Number.isFinite(lng)
        )
    ){

        return;

    }


    const item =
        gallery.find(
            entry =>
                entry &&
                galleryId &&
                String(entry.id) ===
                String(galleryId)
        );


    const targetLat =
        item &&
        Number.isFinite(
            Number(item.latitude)
        )
            ?
            Number(item.latitude)
            :
            lat;


    const targetLng =
        item &&
        Number.isFinite(
            Number(item.longitude)
        )
            ?
            Number(item.longitude)
            :
            lng;


    if(
        !Number.isFinite(targetLat) ||
        !Number.isFinite(targetLng)
    ){

        return;

    }


    map.setView(
        [
            targetLat,
            targetLng
        ],
        Math.max(
            map.getZoom(),
            13
        ),
        {
            animate:true
        }
    );


    galleryLayer.eachLayer(
        layer => {

            if(
                layer.getLatLng &&
                Math.abs(
                    layer.getLatLng().lat -
                    targetLat
                ) < 0.00001 &&
                Math.abs(
                    layer.getLatLng().lng -
                    targetLng
                ) < 0.00001
            ){

                setTimeout(
                    () => {

                        layer.openPopup();

                    },
                    450
                );

            }

        }
    );

}

/* =====================================================
   GEOJSON IMPORT
===================================================== */

const importControl =
    L.control({
        position:
            "topright"
    });


importControl.onAdd =
function(){

    const container =
        L.DomUtil.create(
            "div",
            "geojson-control"
        );


    const button =
        L.DomUtil.create(
            "button",
            "",
            container
        );


    button.innerHTML =
        "📥 Import GeoJSON";


    button.onclick =
    function(){

        const input =
            document.createElement(
                "input"
            );


        input.type =
            "file";


        input.accept =
            ".geojson,.json";


        input.onchange =
        function(event){

            const file =
                event.target.files[0];


            if(!file){
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
            function(){

                try{

                    const data =
                        JSON.parse(
                            reader.result
                        );


                    const layer =
                        L.geoJSON(
                            data
                        );


                    layer.eachLayer(
                        item => {

                            drawnItems.addLayer(
                                item
                            );

                        }
                    );


                    if(
                        layer.getBounds &&
                        layer.getBounds().isValid()
                    ){

                        map.fitBounds(
                            layer.getBounds(),
                            {
                                padding:
                                    [30,30]
                            }
                        );

                    }

                }
                catch(error){

                    alert(
                        "Hibás GeoJSON fájl."
                    );

                }

            };


            reader.readAsText(
                file
            );

        };


        input.click();

    };


    L.DomEvent.disableClickPropagation(
        container
    );


    return container;

};


importControl.addTo(
    map
);

function(){

        L.DomUtil.create(
            "div",

        );


    const button =
        L.DomUtil.create(
            "button",
            "",
            container
        );


    button.innerHTML =
        "📤 Export GeoJSON";


    button.onclick =
    function(){

        const data =
            drawnItems.toGeoJSON();


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/geo+json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            "karpatalja.geojson";


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        URL.revokeObjectURL(
            url
        );

    };


    L.DomEvent.disableClickPropagation(
        container
    );


    return container;

};

/* =====================================================
   PREZI DRAG
===================================================== */

function makePreziDraggable(
    element,
    object
){

    let dragging =
        false;


    let startX =
        0;


    let startY =
        0;


    let originalX =
        0;


    let originalY =
        0;


    element.addEventListener(
        "pointerdown",
        function(event){

            dragging =
                true;


            element.setPointerCapture(
                event.pointerId
            );


            startX =
                event.clientX;


            startY =
                event.clientY;


            originalX =
                object.x;


            originalY =
                object.y;


            event.preventDefault();

        }
    );


    element.addEventListener(
        "pointermove",
        function(event){

            if(
                !dragging
            ){

                return;

            }


            const rect =
                document
                    .getElementById(
                        "preziMap"
                    )
                    .getBoundingClientRect();


            const dx =
                (
                    event.clientX -
                    startX
                )
                /
                rect.width
                *
                100;


            const dy =
                (
                    event.clientY -
                    startY
                )
                /
                rect.height
                *
                100;


            object.x =
                originalX +
                dx;


            object.y =
                originalY +
                dy;


            object.x =
                Math.max(
                    0,
                    Math.min(
                        100,
                        object.x
                    )
                );


            object.y =
                Math.max(
                    0,
                    Math.min(
                        100,
                        object.y
                    )
                );


            element.style.left =
                object.x +
                "%";


            element.style.top =
                object.y +
                "%";

        }
    );


    element.addEventListener(
        "pointerup",
        function(){

            dragging =
                false;

            savePrezi();

        }
    );

}

    renderPreziObjects();

};


/* =====================================================
   SZÖVEG TÖRLÉSE
===================================================== */

document.getElementById(
    "preziDeleteText"
).onclick =
function(){

    if(
        !selectedPreziObject
    ){

        return;

    }


    const frame =
        preziFrames[
            preziIndex
        ];


    frame.objects =
        frame.objects.filter(
            function(object){

                return (
                    object.id !==
                    selectedPreziObject.id
                );

            }
        );


    selectedPreziObject =
        null;


    document
        .getElementById(
            "preziTextEditor"
        )
        .classList.remove(
            "active"
        );


    savePrezi();

    renderPreziObjects();

};


/* =====================================================
   PREZI INDÍTÁSA
===================================================== */

document.getElementById(
    "preziStart"
).onclick =
function(){

    if(
        !preziFrames.length
    ){

        alert(
            "Először hozz létre legalább egy diát."
        );

        return;

    }


    presentationRunning =
        true;


    preziEditor.classList.add(
        "active"
    );


    document
        .getElementById(
            "presentationOverlay"
        )
        .classList.add(
            "active"
        );


    playPreziFrame();

};


/* =====================================================
   PREZI SZERKESZTŐ MEGNYITÁSA
===================================================== */

const preziOpenControl =
    L.control({
        position:
            "topright"
    });


preziOpenControl.onAdd =
function(){

    const container =
        L.DomUtil.create(
            "div",
            "geojson-control"
        );


    const button =
        L.DomUtil.create(
            "button",
            "",
            container
        );


    button.className =
        "prezi-button";


    button.innerHTML =
        "🎬 Prezi szerkesztő";


    button.onclick =
    function(){

        preziEditor.classList.add(
            "active"
        );


        setTimeout(
            function(){

                preziMap.invalidateSize();

            },
            100
        );


        if(
            !preziFrames.length
        ){

            preziFrames.push({

                id:
                    "frame-" +
                    Date.now(),

                title:
                    "Kárpátalja",

                text:
                    "Interaktív földrajzi bemutató.",

                lat:
                    map.getCenter().lat,

                lng:
                    map.getCenter().lng,

                zoom:
                    map.getZoom(),

                objects:
                    []

            });


            preziIndex =
                0;


            savePrezi();

        }


        loadPreziFrame();

        renderPreziFrames();

    };


    L.DomEvent.disableClickPropagation(
        container
    );


    return container;

};


preziOpenControl.addTo(
    map
);


/* =====================================================
   PREZENTÁCIÓ
===================================================== */

function playPreziFrame(){

    const frame =
        preziFrames[
            preziIndex
        ];


    document.getElementById(
        "presentationCounter"
    ).textContent =
        "KÁRPÁTALJA ATLASZ • " +
        (preziIndex + 1) +
        " / " +
        preziFrames.length;


    document.getElementById(
        "presentationTitle"
    ).textContent =
        frame.title;


    document.getElementById(
        "presentationText"
    ).textContent =
        frame.text;


    preziMap.flyTo(
        [
            frame.lat,
            frame.lng
        ],
        frame.zoom,
        {
            animate:true,
            duration:2.2,
            easeLinearity:.2
        }
    );


    renderPreziObjects();

}


/* =====================================================
   KÖVETKEZŐ
===================================================== */

document.getElementById(
    "presentationNext"
).onclick =
function(){

    if(
        preziIndex <
        preziFrames.length - 1
    ){

        preziIndex++;

        playPreziFrame();

        loadPreziFrame();

        renderPreziFrames();

    }

};


/* =====================================================
   ELŐZŐ
===================================================== */

document.getElementById(
    "presentationPrev"
).onclick =
function(){

    if(
        preziIndex >
        0
    ){

        preziIndex--;

        playPreziFrame();

        loadPreziFrame();

        renderPreziFrames();

    }

};


/* =====================================================
   KILÉPÉS
===================================================== */

document.getElementById(
    "presentationExit"
).onclick =
function(){

    presentationRunning =
        false;


    document
        .getElementById(
            "presentationOverlay"
        )
        .classList.remove(
            "active"
        );


    preziEditor.classList.remove(
        "active"
    );

};


/* =====================================================
   BILLENTYŰ
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            !presentationRunning
        ){

            return;

        }


        if(
            event.key ===
            "ArrowRight"
        ){

            document
                .getElementById(
                    "presentationNext"
                )
                .click();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            document
                .getElementById(
                    "presentationPrev"
                )
                .click();

        }


        if(
            event.key ===
            "Escape"
        ){

            document
                .getElementById(
                    "presentationExit"
                )
                .click();

        }

    }
);


/* =====================================================
   EXPORT PREZI
===================================================== */

document.getElementById(
    "preziExport"
).onclick =
function(){

    const blob =
        new Blob(
            [
                JSON.stringify(
                    preziFrames,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "karpatalja-prezi.json";


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );

};


/* =====================================================
   IMPORT PREZI
===================================================== */

document.getElementById(
    "preziImport"
).onclick =
function(){

    document.getElementById(
        "preziFile"
    ).click();

};


document.getElementById(
    "preziFile"
).onchange =
function(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
    function(){

        try{

            const data =
                JSON.parse(
                    reader.result
                );


            if(
                !Array.isArray(data) ||
                !data.length
            ){

                throw new Error();

            }


            preziFrames =
                data;


            preziIndex =
                0;


            savePrezi();

            loadPreziFrame();

            renderPreziFrames();

            renderPreziObjects();

        }
        catch(error){

            alert(
                "Hibás Prezi JSON fájl."
            );

        }

    };


    reader.readAsText(
        file
    );

};


/* =====================================================
   TÉRKÉP VISSZA
===================================================== */

const backControl =
    L.control({
        position:
            "bottomright"
    });


backControl.onAdd =
function(){

    const container =
        L.DomUtil.create(
            "div",
            "geojson-control"
        );


    const button =
        L.DomUtil.create(
            "button",
            "",
            container
        );


    button.innerHTML =
        "🗺️ Térkép";


    button.onclick =
    function(){

        preziEditor.classList.remove(
            "active"
        );

    };


    L.DomEvent.disableClickPropagation(
        container
    );


    return container;

};


backControl.addTo(
    map
);


/* =====================================================
   HTML BIZTONSÁG
===================================================== */

function escapeHTML(
    value
){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   KÉSZ
===================================================== */

console.log(
    "Kárpátalja Atlasz – professzionális földrajzi térkép + galéria + GeoJSON + Draw + Prezi rendszer betöltve."
);

</script>

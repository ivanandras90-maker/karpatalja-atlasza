<!-- ==========================================================
     OLDAL SPECIFIKUS VEZÉRLÉS
     ========================================================== -->

<script>

(function () {

    "use strict";


    /* ========================================================
       DOM READY
       ======================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            /* ==================================================
               TÉRKÉP INICIALIZÁLÁSA
               ================================================== */

            function initializeMap() {

                if (
                    window.AtlasMap &&
                    typeof window.AtlasMap.initialize ===
                        "function"
                ) {

                    window.AtlasMap.initialize();

                    return true;

                }


                if (
                    window.AtlasMap &&
                    typeof window.AtlasMap.init ===
                        "function"
                ) {

                    window.AtlasMap.init();

                    return true;

                }


                return false;

            }


            if (
                !initializeMap()
            ) {

                let attempts = 0;


                const timer =
                    setInterval(
                        function () {

                            attempts++;


                            if (
                                initializeMap()
                            ) {

                                clearInterval(
                                    timer
                                );

                                return;

                            }


                            if (
                                attempts >= 50
                            ) {

                                clearInterval(
                                    timer
                                );

                                console.error(
                                    "A térkép inicializálása nem sikerült."
                                );

                            }

                        },
                        100
                    );

            }



            /* ==================================================
               OLDALSÁV BE / KI
               ================================================== */

            const sidebar =
                document.getElementById(
                    "mapSidebar"
                );


            const sidebarToggle =
                document.getElementById(
                    "sidebarToggle"
                );


            if (
                sidebar &&
                sidebarToggle
            ) {

                sidebarToggle.addEventListener(
                    "click",
                    function () {

                        const collapsed =
                            sidebar.classList.toggle(
                                "collapsed"
                            );


                        sidebarToggle.textContent =
                            collapsed
                                ? "›"
                                : "‹";


                        sidebarToggle.setAttribute(
                            "aria-label",
                            collapsed
                                ? "Oldalsáv megnyitása"
                                : "Oldalsáv bezárása"
                        );


                        setTimeout(
                            function () {

                                if (
                                    window.AtlasMap &&
                                    typeof window.AtlasMap.invalidateSize ===
                                        "function"
                                ) {

                                    window.AtlasMap.invalidateSize();

                                }

                                else if (
                                    window.AtlasMap &&
                                    window.AtlasMap.map
                                ) {

                                    window.AtlasMap.map.invalidateSize();

                                }

                            },
                            250
                        );

                    }
                );

            }



            /* ==================================================
               ÁTLÁTSZÓSÁG
               ================================================== */

            const opacitySlider =
                document.getElementById(
                    "opacitySlider"
                );


            const opacityValue =
                document.getElementById(
                    "opacityValue"
                );


            if (
                opacitySlider
            ) {

                opacitySlider.addEventListener(
                    "input",
                    function () {

                        const value =
                            Number(
                                opacitySlider.value
                            );


                        if (
                            opacityValue
                        ) {

                            opacityValue.textContent =
                                `${value}%`;

                        }


                        const opacity =
                            value / 100;


                        /*
                         * Ha van rétegkezelő API,
                         * minden aktív rétegre alkalmazzuk.
                         */

                        if (
                            window.AtlasLayers &&
                            typeof window.AtlasLayers.setAllLayersOpacity ===
                                "function"
                        ) {

                            window.AtlasLayers.setAllLayersOpacity(
                                opacity
                            );

                        }

                        else if (
                            window.AtlasMap &&
                            typeof window.AtlasMap.setLayerOpacity ===
                                "function"
                        ) {

                            window.AtlasMap.setLayerOpacity(
                                opacity
                            );

                        }

                    }
                );

            }



            /* ==================================================
               ZOOM +
               ================================================== */

            const zoomIn =
                document.getElementById(
                    "zoomIn"
                );


            if (
                zoomIn
            ) {

                zoomIn.addEventListener(
                    "click",
                    function () {

                        if (
                            window.AtlasMap &&
                            typeof window.AtlasMap.zoomIn ===
                                "function"
                        ) {

                            window.AtlasMap.zoomIn();

                        }

                        else if (
                            window.AtlasMap &&
                            window.AtlasMap.map
                        ) {

                            window.AtlasMap.map.zoomIn();

                        }

                    }
                );

            }



            /* ==================================================
               ZOOM -
               ================================================== */

            const zoomOut =
                document.getElementById(
                    "zoomOut"
                );


            if (
                zoomOut
            ) {

                zoomOut.addEventListener(
                    "click",
                    function () {

                        if (
                            window.AtlasMap &&
                            typeof window.AtlasMap.zoomOut ===
                                "function"
                        ) {

                            window.AtlasMap.zoomOut();

                        }

                        else if (
                            window.AtlasMap &&
                            window.AtlasMap.map
                        ) {

                            window.AtlasMap.map.zoomOut();

                        }

                    }
                );

            }



            /* ==================================================
               ALAPHELYZET
               ================================================== */

            const resetView =
                document.getElementById(
                    "resetView"
                );


            if (
                resetView
            ) {

                resetView.addEventListener(
                    "click",
                    function () {

                        if (
                            window.AtlasMap &&
                            typeof window.AtlasMap.resetView ===
                                "function"
                        ) {

                            window.AtlasMap.resetView();

                        }

                    }
                );

            }



            /* ==================================================
               HELYZETMEGHATÁROZÁS
               ================================================== */

            const locateButton =
                document.getElementById(
                    "locateButton"
                );


            if (
                locateButton
            ) {

                locateButton.addEventListener(
                    "click",
                    function () {

                        if (
                            window.AtlasMap &&
                            typeof window.AtlasMap.locateUser ===
                                "function"
                        ) {

                            window.AtlasMap.locateUser();

                        }

                        else if (
                            window.AtlasMap &&
                            typeof window.AtlasMap.locate ===
                                "function"
                        ) {

                            window.AtlasMap.locate();

                        }

                    }
                );

            }



            /* ==================================================
               TELJES KÉPERNYŐ
               ================================================== */

            const fullscreenButton =
                document.getElementById(
                    "fullscreenButton"
                );


            const mapFullscreen =
                document.getElementById(
                    "mapFullscreen"
                );


            function toggleFullscreen() {

                const container =
                    document.getElementById(
                        "mapContainer"
                    );


                if (!container) {

                    return;

                }


                if (
                    document.fullscreenElement
                ) {

                    document.exitFullscreen();

                    return;

                }


                if (
                    container.requestFullscreen
                ) {

                    container.requestFullscreen();

                }

                else if (
                    window.AtlasMap &&
                    typeof window.AtlasMap.toggleFullscreen ===
                        "function"
                ) {

                    window.AtlasMap.toggleFullscreen();

                }

            }


            if (
                fullscreenButton
            ) {

                fullscreenButton.addEventListener(
                    "click",
                    toggleFullscreen
                );

            }


            if (
                mapFullscreen
            ) {

                mapFullscreen.addEventListener(
                    "click",
                    toggleFullscreen
                );

            }



            /* ==================================================
               FEATURE INFO BEZÁRÁSA
               ================================================== */

            const featureInfoClose =
                document.getElementById(
                    "featureInfoClose"
                );


            const featureInfo =
                document.getElementById(
                    "featureInfo"
                );


            if (
                featureInfoClose &&
                featureInfo
            ) {

                featureInfoClose.addEventListener(
                    "click",
                    function () {

                        featureInfo.classList.remove(
                            "visible"
                        );

                        featureInfo.classList.remove(
                            "open"
                        );

                    }
                );

            }



            /* ==================================================
               TÉRKÉP MÉRET FRISSÍTÉSE
               ================================================== */

            window.addEventListener(
                "resize",
                function () {

                    if (
                        window.AtlasMap &&
                        typeof window.AtlasMap.invalidateSize ===
                            "function"
                    ) {

                        window.AtlasMap.invalidateSize();

                    }

                    else if (
                        window.AtlasMap &&
                        window.AtlasMap.map
                    ) {

                        window.AtlasMap.map.invalidateSize();

                    }

                }
            );



            /* ==================================================
               BETÖLTÉS ELREJTÉSE
               ================================================== */

            function hideLoading() {

                const loading =
                    document.getElementById(
                        "mapLoading"
                    );


                if (!loading) {

                    return;

                }


                loading.classList.add(
                    "hidden"
                );


                loading.classList.remove(
                    "visible"
                );

            }


            document.addEventListener(
                "atlasmapready",
                hideLoading
            );


            document.addEventListener(
                "atlaslayersready",
                function () {

                    setTimeout(
                        hideLoading,
                        250
                    );

                }
            );


            window.addEventListener(
                "load",
                function () {

                    setTimeout(
                        hideLoading,
                        1200
                    );

                }
            );


        }
    );

})();

</script>


</body>
</html>

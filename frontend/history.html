document.addEventListener("click",function(event){
    const edit=event.target.closest("[data-draw-edit]");
    const coords=event.target.closest("[data-draw-coords]");
    if(edit){event.preventDefault();openDrawPropertyEditor(edit.dataset.drawEdit);}
    if(coords){event.preventDefault();openDrawAnalysis(coords.dataset.drawCoords);}
});

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   ALAP
===================================================== */

const map =
    L.map("map",{
        preferCanvas:true,
        zoomControl:true
    })
    .setView(
        [48.45,22.75],

    );


/* =====================================================
   TÉRKÉPRÉTEGEK
===================================================== */

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


const satellite =
    L.tileLayer(
        "https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",

            maxZoom:20,
            subdomains:["mt0","mt1","mt2","mt3"],
            attribution:"Google Satellite"
        }
    );

const outdoors =

outdoors.on("add",function(){
    if(!KA_prepareOutdoorsLayer(outdoors,map)){
        map.removeLayer(outdoors);
    }
});

const baseMaps = {

    "🛰️ Google műhold": satellite,
    "🥾 Outdoors": outdoors
};

window.KA_RASTER_EXPORT_BASEMAPS = baseMaps;


/* =====================================================
   TÖRTÉNELMI RÉTEGEK
===================================================== */

const historicalPlacesLayer =
    L.layerGroup();

const historicalEventsLayer =
    L.layerGroup();

const historicalCountiesLayer =
    L.layerGroup();

const historicalGalleryLayer =
    L.layerGroup();

/* Unified V21 historical layers: visibility is controlled by the common Layer panel. */
historicalPlacesLayer.addTo(map);
historicalEventsLayer.addTo(map);
historicalCountiesLayer.addTo(map);
historicalGalleryLayer.addTo(map);


/* =====================================================
   ADATÁLLAPOT
===================================================== */

let atlasData = null;

let historicalPlaces = [];

let historicalEvents = [];

let historicalCounties = [];

let historicalGallery = [];

let historicalPeriods = [];

let historicalPeople = [];

let activePeriod = "all";

let activeType = "all";

let activeSearch = "";


/* =====================================================
   RÉTEGVEZÉRLŐ
===================================================== */

const overlays = {

    "📜 Történelmi helyszínek":
        historicalPlacesLayer,

    "⚔️ Történelmi események":
        historicalEventsLayer,

    "🏛️ Egykori vármegyék":
        historicalCountiesLayer,

    "📷 Történelmi galéria":
        historicalGalleryLayer

};





/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   KOORDINÁTA ELLENŐRZÉS
===================================================== */

function validCoordinates(item){

    const lat =
        Number(item?.latitude);

    const lng =
        Number(item?.longitude);

    return (
        Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= -90 &&
        lat <= 90 &&
        lng >= -180 &&
        lng <= 180
    );

}


/* =====================================================
   KORSZAK CÍM
===================================================== */

function getPeriodTitle(
    periodId
){

    const period =
        historicalPeriods.find(
            item =>
                String(item?.id) ===
                String(periodId)
        );

    return (
        period?.title ||
        periodId ||
        ""
    );

}


/* =====================================================
   FORRÁS HTML
===================================================== */

function buildSourceHTML(
    item
){

    if(!item?.source){
        return "";
    }

    const description =
        item.sourceDescription
            ?
            `<br>
             <span>
                ${escapeHTML(
                    item.sourceDescription
                )}
             </span>`
            :
            "";

    const link =
        item.sourceUrl
            ?
            `<div style="margin-top:6px;">
                <a
                    href="${escapeHTML(item.sourceUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Forrás megnyitása ↗
                </a>
             </div>`
            :
            "";

    return `
        <div class="history-source">
            <strong>Forrás:</strong>
            ${escapeHTML(item.source)}
            ${description}
            ${link}
        </div>
    `;

}


/* =====================================================
   TÖRTÉNELMI HELYSZÍN POPUP
===================================================== */

function buildPlacePopup(
    item
){

    const period =
        getPeriodTitle(
            item.period
        );

    const image =
        item.image
            ?
            `<img
                src="${escapeHTML(item.image)}"
                alt="${escapeHTML(item.title || "Történelmi helyszín")}"
                loading="lazy"
            >`
            :
            "";

    const year =
        item.year !== undefined &&
        item.year !== null &&
        item.year !== ""
            ?
            `<span class="history-badge">
                Év: ${escapeHTML(item.year)}
             </span>`
            :
            "";

    const periodBadge =
        period
            ?
            `<span class="history-badge">
                ${escapeHTML(period)}
             </span>`
            :
            "";

    const mapLink =
        validCoordinates(item)
            ?
            `<a
                class="gold"
                href="geography.html?historical=${encodeURIComponent(item.id || "")}&lat=${Number(item.latitude)}&lng=${Number(item.longitude)}"
            >
                Földrajzi térkép
             </a>`
            :
            "";

    return `
        <div class="history-popup">

            ${image}

            <h3>
                📜 ${escapeHTML(
                    item.title ||
                    "Történelmi helyszín"
                )}
            </h3>

            <div class="history-meta">
                ${periodBadge}
                ${year}
            </div>

            <p>
                ${escapeHTML(
                    item.description ||
                    ""
                )}
            </p>

            ${buildSourceHTML(item)}

            ${
                validCoordinates(item)
                    ?
                    `<div class="history-source">
                        Koordináta:
                        ${Number(item.latitude).toFixed(5)},
                        ${Number(item.longitude).toFixed(5)}
                     </div>`
                    :
                    ""
            }

            <div class="history-actions">
                ${mapLink}
            </div>

        </div>
    `;

}


/* =====================================================
   ESEMÉNY POPUP
===================================================== */

function buildEventPopup(
    item
){

    const period =
        getPeriodTitle(
            item.period
        );

    const year =
        item.year !== undefined &&
        item.year !== null &&
        item.year !== ""
            ?
            `<span class="history-badge">
                ${escapeHTML(item.year)}
             </span>`
            :
            "";

    return `
        <div class="history-popup">

            <h3>
                ⚔️ ${escapeHTML(
                    item.title ||
                    "Történelmi esemény"
                )}
            </h3>

            <div class="history-meta">

                ${
                    period
                        ?
                        `<span class="history-badge">
                            ${escapeHTML(period)}
                         </span>`
                        :
                        ""
                }

                ${year}

            </div>

            <p>
                ${escapeHTML(
                    item.description ||
                    ""
                )}
            </p>

            ${buildSourceHTML(item)}

            ${
                validCoordinates(item)
                    ?
                    `<div class="history-source">
                        Koordináta:
                        ${Number(item.latitude).toFixed(5)},
                        ${Number(item.longitude).toFixed(5)}
                     </div>`
                    :
                    ""
            }

        </div>
    `;

}


/* =====================================================
   GALÉRIA POPUP
===================================================== */

function buildGalleryPopup(
    item
){

    const image =
        item.image
            ?
            `<img
                src="${escapeHTML(item.image)}"
                alt="${escapeHTML(item.title || "Galéria")}"
                loading="lazy"
            >`
            :
            "";

    const period =
        getPeriodTitle(
            item.period
        ) ||
        item.period ||
        "";

    return `
        <div class="history-popup">

            ${image}

            <h3>
                📷 ${escapeHTML(
                    item.title ||
                    "Galéria"
                )}
            </h3>

            <div class="history-meta">

                ${
                    item.category
                        ?
                        `<span class="history-badge">
                            ${escapeHTML(item.category)}
                         </span>`
                        :
                        ""
                }

                ${
                    period
                        ?
                        `<span class="history-badge">
                            ${escapeHTML(period)}
                         </span>`
                        :
                        ""
                }

            </div>

            <p>
                ${escapeHTML(
                    item.description ||
                    ""
                )}
            </p>

            ${buildSourceHTML(item)}

            ${
                validCoordinates(item)
                    ?
                    `<div class="history-source">
                        Koordináta:
                        ${Number(item.latitude).toFixed(5)},
                        ${Number(item.longitude).toFixed(5)}
                     </div>`
                    :
                    ""
            }

            <div class="history-actions">

                <a
                    class="gold"
                    href="gallery.html?gallery=${encodeURIComponent(item.id || "")}"
                >
                    Galériában megnyitás
                </a>

            </div>

        </div>
    `;

}


/* =====================================================
   TÖRTÉNELMI HELYSZÍN IKON
===================================================== */

const placeIcon =
    L.divIcon({

        className:"",

        html:
            `<div class="historical-place-marker">
                📜
             </div>`,

        iconSize:
            [34,34],

        iconAnchor:
            [17,17],

        popupAnchor:
            [0,-17]

    });


/* =====================================================
   ESEMÉNY IKON
===================================================== */

const eventIcon =
    L.divIcon({

        className:"",

        html:
            `<div class="historical-event-marker">
                ⚔️
             </div>`,

        iconSize:
            [36,36],

        iconAnchor:
            [18,18],

        popupAnchor:
            [0,-18]

    });


/* =====================================================
   GALÉRIA IKON
===================================================== */

const galleryIcon =
    L.divIcon({

        className:"",

        html:
            `<div class="historical-people-marker">
                📷
             </div>`,

        iconSize:
            [34,34],

        iconAnchor:
            [17,17],

        popupAnchor:
            [0,-17]

    });


/* =====================================================
   RÉTEGEK ÚJRAÉPÍTÉSE
===================================================== */

function renderHistoricalLayers(){

    historicalPlacesLayer.clearLayers();

    historicalEventsLayer.clearLayers();

    historicalCountiesLayer.clearLayers();

    historicalGalleryLayer.clearLayers();


    const matchesPeriod =
        item =>
            activePeriod === "all" ||
            String(item?.period) ===
            String(activePeriod);


    const matchesSearch =
        item => {

            if(!activeSearch){
                return true;
            }

            const text =
                [
                    item?.title,
                    item?.description,
                    item?.source,
                    item?.year
                ]
                .join(" ")
                .toLowerCase();

            return text.includes(
                activeSearch
            );

        };


    if(
        activeType === "all" ||
        activeType === "place"
    ){

        historicalPlaces

            .filter(
                item =>
                    item &&
                    item.visible !== false &&
                    item.mapVisible !== false &&
                    validCoordinates(item) &&
                    matchesPeriod(item) &&
                    matchesSearch(item)
            )

            .sort(
                (a,b) =>
                    Number(a.order || 0) -
                    Number(b.order || 0)
            )

            .forEach(
                item => {

                    const marker =
                        L.marker(
                            [
                                Number(item.latitude),
                                Number(item.longitude)
                            ],
                            {
                                icon:placeIcon,
                                title:
                                    item.title ||
                                    "Történelmi helyszín"
                            }
                        );

                    marker.bindPopup(
                        buildPlacePopup(item),
                        {
                            maxWidth:350
                        }
                    );

                    marker.addTo(
                        historicalPlacesLayer
                    );

                }
            );

    }


    if(
        activeType === "all" ||
        activeType === "event"
    ){

        historicalEvents

            .filter(
                item =>
                    item &&
                    item.visible !== false &&
                    item.mapVisible !== false &&
                    validCoordinates(item) &&
                    matchesPeriod(item) &&
                    matchesSearch(item)
            )

            .sort(
                (a,b) =>
                    Number(a.order || 0) -
                    Number(b.order || 0)
            )

            .forEach(
                item => {

                    const marker =
                        L.marker(
                            [
                                Number(item.latitude),
                                Number(item.longitude)
                            ],
                            {
                                icon:eventIcon,
                                title:
                                    item.title ||
                                    "Történelmi esemény"
                            }
                        );

                    marker.bindPopup(
                        buildEventPopup(item),
                        {
                            maxWidth:350
                        }
                    );

                    marker.addTo(
                        historicalEventsLayer
                    );

                }
            );

    }


    if(
        activeType === "all" ||
        activeType === "county"
    ){

        historicalCounties

            .filter(
                item =>
                    item &&
                    item.visible !== false &&
                    item.mapVisible !== false &&
                    item.geojson &&
                    matchesPeriod(item) &&
                    matchesSearch(item)
            )

            .sort(
                (a,b) =>
                    Number(a.order || 0) -
                    Number(b.order || 0)
            )

            .forEach(
                item => {

                    try{

                        const geojson =
                            typeof item.geojson === "string"
                                ?
                                JSON.parse(
                                    item.geojson
                                )
                                :
                                item.geojson;


                        const layer =
                            L.geoJSON(
                                geojson,
                                {

                                    style:{
                                        color:"#8b6f2f",
                                        weight:2,
                                        opacity:.9,
                                        fillOpacity:.10
                                    },

                                    onEachFeature:
                                        function(
                                            feature,
                                            featureLayer
                                        ){

                                            featureLayer.bindPopup(
                                                `
                                                <div class="history-popup">

                                                    <h3>
                                                        🏛️
                                                        ${escapeHTML(
                                                            item.title ||
                                                            "Egykori vármegye"
                                                        )}
                                                    </h3>

                                                    ${
                                                        item.period
                                                            ?
                                                            `<div class="history-meta">
                                                                <span class="history-badge">
                                                                    ${escapeHTML(
                                                                        getPeriodTitle(
                                                                            item.period
                                                                        )
                                                                    )}
                                                                </span>
                                                             </div>`
                                                            :
                                                            ""
                                                    }

                                                    <p>
                                                        ${escapeHTML(
                                                            item.description ||
                                                            ""
                                                        )}
                                                    </p>

                                                    ${buildSourceHTML(item)}

                                                </div>
                                                `
                                            );

                                        }

                                }
                            );

                        layer.addTo(
                            historicalCountiesLayer
                        );

                    }
                    catch(error){

                        console.warn(
                            "Hibás történelmi GeoJSON:",
                            item.id,
                            error
                        );

                    }

                }
            );

    }


    if(
        activeType === "all" ||
        activeType === "gallery"
    ){

        historicalGallery

            .filter(
                item =>
                    item &&
                    item.visible !== false &&
                    item.mapVisible !== false &&
                    validCoordinates(item) &&
                    matchesPeriod(item) &&
                    matchesSearch(item)
            )

            .sort(
                (a,b) =>
                    Number(a.order || 0) -
                    Number(b.order || 0)
            )

            .forEach(
                item => {

                    const marker =
                        L.marker(
                            [
                                Number(item.latitude),
                                Number(item.longitude)
                            ],
                            {
                                icon:galleryIcon,
                                title:
                                    item.title ||
                                    "Galéria"
                            }
                        );

                    marker.bindPopup(
                        buildGalleryPopup(item),
                        {
                            maxWidth:350
                        }
                    );

                    marker.addTo(
                        historicalGalleryLayer
                    );

                }
            );

    }


    updateStatistics();

}


/* =====================================================
   STATISZTIKA
===================================================== */

function updateStatistics(){

    const visiblePlaces =
        historicalPlaces.filter(
            item =>
                item &&
                item.visible !== false &&
                item.mapVisible !== false &&
                validCoordinates(item) &&
                (
                    activePeriod === "all" ||
                    String(item.period) ===
                    String(activePeriod)
                )
        ).length;


    const visibleEvents =
        historicalEvents.filter(
            item =>
                item &&
                item.visible !== false &&
                item.mapVisible !== false &&
                validCoordinates(item) &&
                (
                    activePeriod === "all" ||
                    String(item.period) ===
                    String(activePeriod)
                )
        ).length;


    const visibleGallery =
        historicalGallery.filter(
            item =>
                item &&
                item.visible !== false &&
                item.mapVisible !== false &&
                validCoordinates(item) &&
                (
                    activePeriod === "all" ||
                    String(item.period) ===
                    String(activePeriod)
                )
        ).length;


    const visibleCounties =
        historicalCounties.filter(
            item =>
                item &&
                item.visible !== false &&
                item.mapVisible !== false &&
                item.geojson &&
                (
                    activePeriod === "all" ||
                    String(item.period) ===
                    String(activePeriod)
                )
        ).length;


    const statsElement = document.getElementById("historyStats");

    if(statsElement){
        statsElement.innerHTML =
            `
            <strong>Térképi objektumok</strong><br>
            📜 Helyszínek: ${visiblePlaces}<br>
            ⚔️ Események: ${visibleEvents}<br>
            📷 Galériapontok: ${visibleGallery}<br>
            🏛️ Vármegyék: ${visibleCounties}<br>
            ⏳ Korszakok: ${historicalPeriods.length}
            `;
    }

}


/* =====================================================
   KORSZAK SZŰRŐ
===================================================== */

function populatePeriods(){

    const select =
        document.getElementById(
            "periodFilter"
        );


    select.innerHTML =
        `<option value="all">
            Összes korszak
         </option>`;


    historicalPeriods

        .filter(
            item =>
                item &&
                item.visible !== false
        )

        .sort(
            (a,b) =>
                Number(a.order || 0) -
                Number(b.order || 0)
        )

        .forEach(
            period => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    period.id || "";

                option.textContent =
                    period.title ||
                    period.id ||
                    "Korszak";

                select.appendChild(
                    option
                );

            }
        );

}


/* =====================================================
   SZŰRŐ ESEMÉNYEK
===================================================== */

document.getElementById(
    "periodFilter"
).addEventListener(

        activePeriod =
            this.value;

    }
);


document.getElementById(

document.getElementById(

/* =====================================================
   ÖSSZES OBJEKTUM
===================================================== */

document.getElementById(
    "showAllButton"
).addEventListener(
    "click",
    function(){

        activePeriod =
            "all";

        activeType =
            "all";

        activeSearch =
            "";

        document.getElementById(

        ).value =

        document.getElementById(
            "typeFilter"
        ).value =
            "all";

        document.getElementById(

    }

   KÁRPÁTALJA NÉZET
===================================================== */

document.getElementById(
    "fitKarpataljaButton"
).addEventListener(
    "click",
    function(){

        map.fitBounds(
            [
                [47.95,21.95],
                [49.15,24.20]
            ],
            {
                padding:
                    [25,25],

                maxZoom:
                    9,

                animate:true
            }
        );

    }

/* =====================================================
   TÖRTÉNELMI ADATOK BETÖLTÉSE
===================================================== */

async function loadHistoricalData(){

    try{

        const response =
            await fetch(
                "../data/atlasz.json",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Az atlasz.json nem tölthető be."
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            typeof data !== "object"
        ){

            throw new Error(
                "Érvénytelen atlasz adatmodell."
            );

        }


        atlasData =
            data;


        historicalPeriods =
            Array.isArray(
                data.historicalPeriods
            )
                ?
                data.historicalPeriods
                :
                [];


        historicalPlaces =
            Array.isArray(
                data.historicalPlaces
            )
                ?
                data.historicalPlaces
                :
                [];


        historicalEvents =
            Array.isArray(
                data.historicalEvents
            )
                ?
                data.historicalEvents
                :
                [];


        historicalCounties =
            Array.isArray(
                data.historicalCounties
            )
                ?
                data.historicalCounties
                :
                [];


        historicalGallery =
            Array.isArray(
                data.gallery
            )
                ?
                data.gallery
                :
                [];


        historicalPeople =
            Array.isArray(
                data.historicalPeople
            )
                ?
                data.historicalPeople
                :
                [];


        populatePeriods();

        renderHistoricalLayers();


        document
            .getElementById(
                "loadingOverlay"
            )
            .classList.add(
                "hidden"
            );


        console.log(
            "Kárpátalja történelmi atlasz betöltve.",
            {
                korszakok:
                    historicalPeriods.length,

                helyszínek:
                    historicalPlaces.length,

                események:
                    historicalEvents.length,

                személyiségek:
                    historicalPeople.length,

                vármegyék:
                    historicalCounties.length,

                galéria:
                    historicalGallery.length
            }
        );


        focusHistoricalFromUrl();


    }
    catch(error){

        console.error(
            error
        );


        document
            .getElementById(
                "loadingOverlay"
            )
            .querySelector("span")
            .textContent =
                "Hiba az atlasz.json betöltésekor.";


        setTimeout(
            function(){

                document
                    .getElementById(
                        "loadingOverlay"
                    )
                    .classList.add(
                        "hidden"
                    );

            },
            1600
        );

    }

}


/* =====================================================
   URL ALAPÚ KIEMELÉS
===================================================== */

function focusHistoricalFromUrl(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const historicalId =
        params.get(
            "historical"
        );


    const eventId =
        params.get(
            "event"
        );


    const galleryId =
        params.get(
            "gallery"
        );


    const lat =
        Number(
            params.get("lat")
        );


    const lng =
        Number(
            params.get("lng")
        );


    let target =
        null;

    let layerGroup =
        null;


    if(historicalId){

        target =
            historicalPlaces.find(
                item =>
                    item &&
                    String(item.id) ===
                    String(historicalId)
            );

        layerGroup =
            historicalPlacesLayer;

    }


    if(
        !target &&
        eventId
    ){

        target =
            historicalEvents.find(
                item =>
                    item &&
                    String(item.id) ===
                    String(eventId)
            );

        layerGroup =
            historicalEventsLayer;

    }


    if(
        !target &&
        galleryId
    ){

        target =
            historicalGallery.find(
                item =>
                    item &&
                    String(item.id) ===
                    String(galleryId)
            );

        layerGroup =
            historicalGalleryLayer;

    }


    if(
        target &&
        validCoordinates(target)
    ){

        const targetLat =
            Number(target.latitude);

        const targetLng =
            Number(target.longitude);


        if(target.period){

            activePeriod =
                String(target.period);

            document.getElementById(
                "periodFilter"
            ).value =
                String(target.period);

            renderHistoricalLayers();

        }


        map.setView(
            [
                targetLat,
                targetLng
            ],
            14,
            {
                animate:true
            }
        );


        setTimeout(
            function(){

                layerGroup.eachLayer(
                    layer => {

                        if(
                            layer.getLatLng &&
                            Math.abs(
                                layer.getLatLng().lat -
                                targetLat
                            ) < .00001 &&
                            Math.abs(
                                layer.getLatLng().lng -
                                targetLng
                            ) < .00001
                        ){

                            layer.openPopup();

                        }

                    }
                );

            },
            450
        );


        return;

    }


    if(
        Number.isFinite(lat) &&
        Number.isFinite(lng)
    ){

        map.setView(
            [
                lat,
                lng
            ],
            14,
            {
                animate:true
            }
        );

    }

}


/* =====================================================
   KOORDINÁTA VEZÉRLŐ
===================================================== */

const coordinateControl =
    L.control({
        position:"bottomleft"
    });


coordinateControl.onAdd =
function(){

    const div =
        L.DomUtil.create(
            "div",
            "coordinate-display"
        );

    div.innerHTML =
        "Koordináta: —";


    map.on(
        "mousemove",
        function(event){

            div.innerHTML =
                "Koordináta: " +
                event.latlng.lat.toFixed(5) +
                ", " +
                event.latlng.lng.toFixed(5);

        }
    );


    L.DomEvent.disableClickPropagation(
        div
    );


    return div;

};


coordinateControl.addTo(
    map
);


/* =====================================================
   GEOJSON RAJZOLÁS
===================================================== */

const drawnItems =
    new L.FeatureGroup();


map.addLayer(
    drawnItems
);


const drawControl =
    new L.Control.Draw({

        position:"topleft",

        edit:{
            featureGroup:
                drawnItems
        },

        draw:{

            polygon:true,

            polyline:true,

            rectangle:true,

            circle:true,

            marker:true,

            circlemarker:false

        }

    });


map.addControl(
    drawControl
);


map.on(
    L.Draw.Event.CREATED,
    function(event){

        drawnItems.addLayer(
            event.layer
        );

    }
);

<script>
document.addEventListener("DOMContentLoaded",function(){
 const wireOpacity=()=>{
   const input=document.getElementById("awOpacity"),out=document.getElementById("awOpacityOut");
   if(!input||input.dataset.wired)return;input.dataset.wired="1";
   input.oninput=()=>{
     out.textContent=Math.round(+input.value*100)+"%";
     try{
       document.querySelectorAll(".atlas-layer-row,.aw-layer-row").forEach(()=>{});
       if(typeof importedVectorRegistry!=="undefined") importedVectorRegistry.forEach(x=>x.group?.eachLayer?.(l=>l.setStyle?.({opacity:+input.value,fillOpacity:+input.value*.35})));
       if(typeof overlays!=="undefined") Object.values(overlays).forEach(g=>g?.eachLayer?.(l=>l.setStyle?.({opacity:+input.value,fillOpacity:+input.value*.35})));
     }catch(e){}
   };
 };
 setInterval(wireOpacity,500);
});

})();

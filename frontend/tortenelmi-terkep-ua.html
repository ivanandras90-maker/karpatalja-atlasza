<script>

/* =========================================
   ОСНОВНА КАРТА
========================================= */

const map = L.map('map').setView(
    [48.45, 22.75],
    8
);


/* =========================================
   БАЗОВА КАРТА
========================================= */

const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors'
    }
);

osm.addTo(map);


/* =========================================
   ІСТОРИЧНІ ШАРИ
========================================= */


/* Ужанський комітат */

const uzh =
    L.layerGroup();


/* Березький комітат */

const bereg =
    L.layerGroup();


/* Угочанський комітат */

const ugocsa =
    L.layerGroup();


/* Марамороський комітат */

const maramures =
    L.layerGroup();


/* Історичні населені пункти */

const historicalSettlements =
    L.layerGroup();


/* Замки та укріплення */

const castles =
    L.layerGroup();


/* Історичні події */

const historicalEvents =
    L.layerGroup();


/* Історичні дороги */

const historicalRoads =
    L.layerGroup();


/* Старі карти */

const oldMaps =
    L.layerGroup();


/* =========================================
   ШАРИ НА КАРТІ
========================================= */

const overlays = {

    "🏛️ Ужанський комітат":
        uzh,

    "🏛️ Березький комітат":
        bereg,

    "🏛️ Угочанський комітат":
        ugocsa,

    "🏛️ Марамороський комітат":
        maramures,

    "🏘️ Історичні населені пункти":
        historicalSettlements,

    "🏰 Замки та укріплення":
        castles,

    "⚔️ Історичні події":
        historicalEvents,

    "🛤️ Історичні дороги":
        historicalRoads,

    "🗺️ Старі карти":
        oldMaps

};


/* =========================================
   КОНТРОЛЬ ШАРІВ
========================================= */

L.control.layers(

    {
        "OpenStreetMap": osm
    },

    overlays,

    {
        collapsed: false
    }

).addTo(map);

</script>


<script src="js/v12-layer-workspace.js"></script>

<script>
/* V12 HEADER CONTROLLER */
(function(){
"use strict";
function wire(){
 const draw=document.getElementById("headerDrawEditorButton");
 const prezi=document.getElementById("headerPresentationButton");
 const ai=document.getElementById("headerAtlasAIButton");
 const ws=document.getElementById("headerLayerWorkspaceButton");
 if(draw) draw.onclick=()=>{
   const p=document.getElementById("featureEditorPanel");
   if(!p){alert("A Draw Feature Editor még nem töltődött be.");return}
   const open=!p.hidden && p.style.display!=="none";
   p.hidden=open;p.style.display=open?"none":"block";
   if(!open) window.renderDrawFeatureEditor?.();
 };
 if(prezi) prezi.onclick=()=>{if(typeof openPreziEditor==="function")openPreziEditor();else alert("A Prezi modul nem töltődött be.")};
 if(ai) ai.onclick=()=>window.AtlasAI?.open?.() || alert("Az Atlas AI modul a backend beállítása után használható.");
 if(ws) ws.onclick=()=>window.AtlasLayerWorkspace?.open?.();
}
document.addEventListener("DOMContentLoaded",()=>setTimeout(wire,500));
})();
</script><script src="js/atlas-ai.js"></script>
<script src="js/v13-legend.js"></script>

<script src="js/v14-opacity.js"></script>

<script>
document.addEventListener("DOMContentLoaded",function(){
 const wireOpacity=()=>{
   const input=document.getElementById("awOpacity"),out=document.getElementById("awOpacityOut");
   if(!input||input.dataset.wired)return;input.dataset.wired="1";
   input.oninput=()=>{
     out.textContent=Math.round(+input.value*100)+"%";
     try{
       document.querySelectorAll(".atlas-layer-row,.aw-layer-row").forEach(()=>{});
       if(typeof importedVectorRegistry!=="undefined") importedVectorRegistry.forEach(x=>x.group?.eachLayer?.(l=>l.setStyle?.({opacity:+input.value,fillOpacity:+input.value*.35})));
       if(typeof overlays!=="undefined") Object.values(overlays).forEach(g=>g?.eachLayer?.(l=>l.setStyle?.({opacity:+input.value,fillOpacity:+input.value*.35})));
     }catch(e){}
   };
 };
 setInterval(wireOpacity,500);
});
</script>

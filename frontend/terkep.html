    width: 100%;

<body>


<!-- =========================================
     FEJLÉC
========================================= -->

<header>

    <h1>
        Kárpátalja Földrajzi és Történeti Atlasza

    <p>
        Földrajz • Történelem • Egykori vármegyék

    <div class="language-switch">

<!-- =========================================
     NAVIGÁCIÓ
========================================= -->

<nav>

    <a href="index.html">
        FŐOLDAL
    </a>

    <a href="geography.html">
        🌍 FÖLDRAJZI TÉRKÉP
    </a>

    <a href="history.html">
        📜 TÖRTÉNELMI TÉRKÉP
    </a>

</nav>


<!-- =========================================
     TÉRKÉP FEJLÉC
========================================= -->

<section class="map-header">

    <h2>
        🌍 Interaktív földrajzi térkép
    </h2>

    <p>
        Kárpátalja földrajzi térképe
        természetföldrajzi és földrajzi objektumokkal.
    </p>

</section>


<!-- =========================================
     TÉRKÉP
========================================= -->

<div id="map"></div>


<!-- =========================================
     LEAFLET
========================================= -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================================
   ALAP TÉRKÉP
========================================= */

const map = L.map('map').setView(
    [48.45, 22.75],
    8
);


/* =========================================
   ALAPTÉRKÉP
========================================= */

const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors'
    }
);

osm.addTo(map);


/* =========================================
   FÖLDRAJZI RÉTEGEK
========================================= */


/* Domborzat */

const relief =
    L.layerGroup();


/* Hegységek */

const mountains =
    L.layerGroup();


/* Folyók */

const rivers =
    L.layerGroup();


/* Tavak */

const lakes =
    L.layerGroup();


/* Települések */

const settlements =
    L.layerGroup();


/* Utak */

const roads =
    L.layerGroup();


/* Közigazgatási határok */

const administrativeBoundaries =
    L.layerGroup();


/* =========================================
   RÉTEGEK NEVEI
========================================= */

const overlays = {

    "🏔️ Domborzat":
        relief,

    "⛰️ Hegységek":
        mountains,

    "🌊 Folyók":
        rivers,

    "💧 Tavak":
        lakes,

    "🏘️ Települések":
        settlements,

    "🛣️ Utak":
        roads,

    "🏛️ Közigazgatási határok":
        administrativeBoundaries

};


/* =========================================
   RÉTEGKEZELŐ
========================================= */

L.control.layers(

    {
        "OpenStreetMap": osm
    },

    overlays,

    {
        collapsed: false
    }

).addTo(map);

</script>


</body>

</html>

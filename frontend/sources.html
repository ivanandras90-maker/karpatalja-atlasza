<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Források · Kárpátalja Atlasz</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/responsive.css"></head><body><header class="simple-header"><div class="container"><a href="index.html">← Kárpátalja Atlasz</a><h1>Források és dokumentáció</h1><p>Az atlaszban felhasznált adatok, térképek és szakirodalom.</p></div></header><main class="sources-page"><div class="container"><div id="sourceList" class="source-list"><div class="loading">Források betöltése…</div></div></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));fetch('../data/atlasz.json').then(r=>r.json()).then(d=>{const groups=[];const walk=(v,k='')=>{if(Array.isArray(v)){v.forEach((x,i)=>walk(x,k||String(i)));}else if(v&&typeof v==='object'){if(v.source||v.sourceUrl||v.sourceDescription)groups.push({title:v.title||v.name||k,source:v.source,sourceUrl:v.sourceUrl,desc:v.sourceDescription||v.description});Object.entries(v).forEach(([kk,x])=>walk(x,kk));}};walk(d);const unique=[];const seen=new Set();for(const x of groups){const key=JSON.stringify(x);if(!seen.has(key)){seen.add(key);unique.push(x)}}document.getElementById('sourceList').innerHTML=unique.length?unique.map(x=>`<article class="source-item"><h2>${esc(x.title)}</h2>${x.desc?`<p>${esc(x.desc)}</p>`:''}${x.sourceUrl?`<a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">Forrás megnyitása →</a>`:''}${x.source?`<div class="source-name">${esc(x.source)}</div>`:''}</article>`).join(''):'<p>Nincs külön forrásrekord megadva az adatállományban. A teljes adatstruktúra az atlasz.json fájlban található.</p>';}).catch(e=>{document.getElementById('sourceList').innerHTML='<p>A forráslista nem tölthető be. Ellenőrizd, hogy az oldalt helyi szerverről nyitod meg, ne közvetlenül file:// útvonalról.</p>'});</script></body></html>
